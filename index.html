    if (d.v){ d.y += d.v*dt; gx.strokeStyle = 'rgba(200,220,235,.12)'; gx.lineWidth = d.r*.7; gx.beginPath(); gx.moveTo(d.x,d.y-d.r*8); gx.lineTo(d.x,d.y); gx.stroke(); }
    const g = gx.createRadialGradient(d.x-d.r*.3,d.y-d.r*.3,0,d.x,d.y,d.r);
    g.addColorStop(0,'rgba(255,255,255,.55)'); g.addColorStop(.5,'rgba(170,190,210,.12)'); g.addColorStop(1,'rgba(10,12,18,.45)');
    gx.fillStyle = g; gx.beginPath(); gx.arc(d.x,d.y,d.r,0,Math.PI*2); gx.fill();
  }
}
function wet(el, from, to, D){
  return new Promise(res => { let last = performance.now(); const t0 = last;
    const f = now => { const t = Math.min(1,(now-t0)/D), e = t<.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2, k = from+(to-from)*e;
      disp.setAttribute('scale', (k*70).toFixed(1));
      el.style.filter = k>0.001 ? `url(#wet) blur(${(k*10).toFixed(2)}px) brightness(${(1-k*.35).toFixed(3)})` : 'none';
      drawGlass(Math.min(1,k*1.6), (now-last)/1000); last = now;
      t<1 ? requestAnimationFrame(f) : res(); };
    requestAnimationFrame(f); });
}

/* 개문 시간 띠 */
function nightNow(){
  const now = $('#pg-now'); if (!now) return;
  const d = new Date(), h = d.getHours()+d.getMinutes()/60, pos = ((h-5+24)%24)/24*100;
  const hm = String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
  now.style.left = pos+'%'; now.dataset.t = '지금 '+hm;
  const open = h>=19 || h<5, dusk = h>=17 && h<19;
  const left = open ? (h>=19 ? 24-h+5 : 5-h) : 19-h, hh = Math.floor(left), mm = Math.round((left-hh)*60);
  $('#pg-state').innerHTML = open ? t(`지금은 <b>門이 열린 때</b>라. 閉門까지 ${hh}시간 ${mm}분이 남았느니라.`,`지금 <b>문이 열려 있다</b>. 닫히기까지 ${hh}시간 ${mm}분.`) : dusk ? t(`지금은 <b>夕</b>이라. 開門까지 ${hh}시간 ${mm}분이 남았느니라.`,`지금은 <b>해질녘</b>이다. 문이 열리기까지 ${hh}시간 ${mm}분.`) : t(`지금은 <b>晝</b>라. 開門까지 ${hh}시간 ${mm}분이 남았느니라.`,`지금은 <b>낮</b>이다. 문이 열리기까지 ${hh}시간 ${mm}분.`);
}
setInterval(nightNow, 30000);

/* 비교 슬라이더 */
function bindKai(){
  const f = $('#kaiFig'), b = $('#kaiWarn'); if (!f) return;
  b.onclick = () => f.classList.remove('veiled');
}
function bindCompare(){
  const c = $('#cmp'); if (!c) return;
  const set = p => { p = Math.max(0,Math.min(100,p)); c.style.setProperty('--x', p+'%'); c.setAttribute('aria-valuenow', Math.round(p)); };
  let drag = false;
  const at = e => { const r = c.getBoundingClientRect(); set((e.clientX-r.left)/r.width*100); };
  c.addEventListener('pointerdown', e => { drag = true; c.setPointerCapture(e.pointerId); at(e); });
  c.addEventListener('pointermove', e => { if (drag) at(e); });
  c.addEventListener('pointerup', () => drag = false);
  c.addEventListener('keydown', e => { const v = parseFloat(c.style.getPropertyValue('--x'))||50; if (e.key==='ArrowLeft') set(v-5); if (e.key==='ArrowRight') set(v+5); });
}

/* 넘어가기 */
const page = $('#page'), menuLinks = [...document.querySelectorAll('#title .menu:not(.outer) a')];
let busy = false, inPage = false, menuAnims = [];
function renderPage(key){
  page.querySelector('.pg-doc').textContent = '神祇廳 記錄 · ' + PLABEL[key];
  page.classList.toggle('rm-on', key==='rumor');
  page.querySelector('.pg-body').innerHTML = PAGES[key] ? PAGES[key]() : `<div class="pg-empty"><div><b>아직 열람할 수 없는 기록입니다</b>신기청이 정리 중입니다.</div></div>`;
  bindCompare(); bindKai(); bindBagua(); bindChips(); bindFaction(); bindRegion(); bindRumor(); nightNow(); applyStyle(); galScan();
}
async function swapPage(key){
  if (busy) return; busy = true; makeDrops();
  if (!RM) await wet(page, 0, 1, 550);
  renderPage(key); page.scrollTop = 0;
  if (!RM) await wet(page, 1, 0, 650);
  page.style.filter = 'none'; drawGlass(0,0); busy = false;
}
async function goPage(key, link){
  if (busy || inPage) return; busy = true;
  const idx = menuLinks.indexOf(link); link.classList.add('sel'); $('#title').classList.add('dim');
  menuAnims = menuLinks.filter(a=>a!==link).map(a => { const i = menuLinks.indexOf(a);
    return a.animate([{transform:'translateY(0)',opacity:1},{transform:`translateY(${i<idx?-150:150}%)`,opacity:0}],{duration:RM?1:460,delay:RM?0:Math.abs(i-idx)*45,easing:'cubic-bezier(.77,0,.175,1)',fill:'forwards'}); });
  renderPage(key);
  makeDrops();
  if (!RM) await wet($('#stage'), 0, 1, 750);
  $('#stage').style.visibility = 'hidden'; page.hidden = false; page.scrollTop = 0;
  if (!RM){ page.style.filter = `url(#wet) blur(10px) brightness(.65)`; await wet(page, 1, 0, 850); }
  page.style.filter = 'none'; drawGlass(0,0);
  page.querySelector('.pg-back').focus({preventScroll:true});
  inPage = true; busy = false;
  if (key !== 'rumor') styleTip();
}
async function backToAlley(){
  if (busy || !inPage) return; busy = true; makeDrops();
  if (!RM) await wet(page, 0, 1, 650);
  page.hidden = true; page.style.filter = 'none'; const st = $('#stage'); st.style.visibility = '';
  if (!RM){ st.style.filter = `url(#wet) blur(10px) brightness(.65)`; await wet(st, 1, 0, 750); }
  st.style.filter = 'none'; drawGlass(0,0);
  $('#title').classList.remove('dim');
  menuAnims.forEach(a => { a.reverse(); a.finished.then(()=>a.cancel()); });
  menuLinks.forEach(a => a.classList.remove('sel'));
  inPage = false; busy = false;
}
menuLinks.forEach(a => a.addEventListener('click', e => { e.preventDefault(); if (a.classList.contains('beyond')) return openBeyond(); goPage(a.getAttribute('href').slice(1), a); }));
/* 경계 밖: 메뉴가 하나씩 아래로 가라앉고, 바깥 링크가 떠오른다 */
const outerNav = $('#title .menu.outer'), outerLinks = [...outerNav.querySelectorAll('a')];
let beyondOpen = false;
const sink = (els, i0=0, gap=60) => els.map((a,i) => a.animate([{transform:'translateY(0)',opacity:1},{transform:'translateY(120%)',opacity:0}],{duration:RM?1:380,delay:RM?0:(i0+i)*gap,easing:'cubic-bezier(.7,0,.84,0)',fill:'forwards'}));
const rise = (els, i0=0, gap=70) => els.map((a,i) => a.animate([{transform:'translateY(120%)',opacity:0},{transform:'translateY(0)',opacity:1}],{duration:RM?1:520,delay:RM?0:(i0+i)*gap,easing:'cubic-bezier(.16,1,.3,1)',fill:'backwards'}));
async function openBeyond(){
  if (busy || beyondOpen) return; busy = true; beyondOpen = true;
  // 왼쪽부터 일곱 개가 차례로 가라앉고, 그 물결을 이어 바깥 메뉴가 왼쪽부터 떠오른다
  const s1 = sink(menuLinks);
  await Promise.all(s1.map(x => x.finished));
  $('#title .menu:not(.outer)').style.visibility = 'hidden';
  outerNav.hidden = false;
  await Promise.all(rise(outerLinks).map(x => x.finished));
  busy = false;
}
async function closeBeyond(){
  if (busy || !beyondOpen) return; busy = true;
  await Promise.all(sink(outerLinks).map(x => x.finished));
  outerNav.hidden = true; outerLinks.forEach(a => a.getAnimations().forEach(x=>x.cancel()));
  menuLinks.forEach(a => a.getAnimations().forEach(x=>x.cancel()));
  const r = rise(menuLinks, 0, 55);
  $('#title .menu:not(.outer)').style.visibility = '';
  await Promise.all(r.map(x => x.finished));
  beyondOpen = false; busy = false;
}
outerNav.querySelector('.ob-back').addEventListener('click', e => { e.preventDefault(); closeBeyond(); });
outerNav.querySelector('.ob-album').addEventListener('click', e => { if (outerNav.querySelector('.ob-album').getAttribute('href') === '#') e.preventDefault(); });
page.addEventListener('click', e => { if (e.target.closest('[data-back]')) backToAlley(); const g = e.target.closest('[data-go]'); if (g) swapPage(g.dataset.go); });
document.addEventListener('keydown', e => { if (e.key==='Escape') backToAlley(); });

addEventListener('resize', () => { size(); sizeInk(); });
size(); sizeInk(); rain();
})();
</script>
