<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>신락전야 개문</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Yuji+Syuku&family=Song+Myung&display=swap">
<style>
/* 한 화면 입장 연출: 비 오는 골목(일반 시점) → 부적에 한 획 → 공간이 찢어지며 신기 시점 */
:root{
  color-scheme:dark;
  --night:#0b0e15;      /* 골목의 밤 */
  --paper:#e6c95f;      /* 괴황지 */
  --shu:#a81c14;        /* 주사(朱砂) 먹 */
  --spirit:#74efe2;     /* 신기의 빛 */
  --rift:#ff3b4e;       /* 개문의 틈 */
  --ink:#ece7da;        /* 글자 */
  --dim:#9aa3b2;
  --kanji:'Yuji Syuku','Song Myung','Noto Serif JP','Noto Serif CJK JP',serif;
  --body:'Song Myung','Noto Serif KR','Noto Serif CJK KR',serif;
}
html,body{height:100%}
body{background:var(--night);color:var(--ink);font-family:var(--body);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--spirit);outline-offset:4px}

#stage{position:relative;height:100%;overflow:hidden;background:var(--night)}
.layer,.shard{position:absolute;inset:0}
.layer svg,.shard svg{width:100%;height:100%;display:block}
#kaimon{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--kanji);font-weight:400;line-height:1;color:#d0141e;text-shadow:0 0 50px rgba(255,30,40,.55),0 12px 50px rgba(0,0,0,.7);pointer-events:none;white-space:nowrap}
#kaimon span{display:block;width:1em;text-align:center;opacity:0}
#kaimon span.on{opacity:1;animation:slam .16s cubic-bezier(.2,1,.3,1)}
#dark{transition:opacity .12s ease-out}
#doors{position:absolute;inset:0;pointer-events:none}
#doors .d{position:absolute;display:block;transition:transform .19s cubic-bezier(.7,0,1,.55)}
#doors .l,#doors .r{top:0;bottom:0;width:50.2%;background:repeating-linear-gradient(90deg,#12141b 0 46px,#0d0f15 46px 48px)}
#doors .l{left:0;transform:translateX(-101%)}#doors .r{right:0;transform:translateX(101%)}
#doors .t,#doors .b{left:0;right:0;height:50.2%;background:repeating-linear-gradient(0deg,#0c0e13 0 30px,#08090d 30px 32px)}
#doors .t{top:0;transform:translateY(-101%)}#doors .b{bottom:0;transform:translateY(101%)}
#doors .g1,#doors .g2{inset:0;background:#06070a}
#doors .g1{clip-path:polygon(0 0,100% 0,0 100%);transform:translate(-100%,-100%)}
#doors .g2{clip-path:polygon(100% 0,100% 100%,0 100%);transform:translate(100%,100%)}
#doors.lr .l,#doors.lr .r,#doors.tb .t,#doors.tb .b,#doors.dg .g1,#doors.dg .g2{transform:none}
#seams{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
#seams line{stroke:#ff4655;stroke-width:2;vector-effect:non-scaling-stroke;opacity:0;filter:drop-shadow(0 0 6px #ff1e32) drop-shadow(0 0 14px #ff1e32);transition:opacity .08s ease-out}
@keyframes slam{from{opacity:0;transform:scale(1.35)}to{opacity:1;transform:scale(1)}}
#shardcv{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#rain{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#noise{position:absolute;inset:0;pointer-events:none;opacity:0;mix-blend-mode:screen}
#dark{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none}
#flash{position:absolute;inset:0;background:#e8fffb;opacity:0;pointer-events:none}

/* 흔들림 */
.shake-s{animation:shs .28s linear}
.shake-l{animation:shl .5s cubic-bezier(.36,.07,.19,.97)}
.shake-m{animation:shm .3s cubic-bezier(.36,.07,.19,.97)}
@keyframes shs{20%{transform:translate(-2px,1px)}40%{transform:translate(2px,-1px)}60%{transform:translate(-1px,-2px)}80%{transform:translate(1px,2px)}}
@keyframes shm{15%{transform:translate(-7px,4px)}35%{transform:translate(6px,-5px)}55%{transform:translate(-4px,2px)}80%{transform:translate(2px,-1px)}}
@keyframes shl{10%{transform:translate(-12px,6px) rotate(-.4deg)}25%{transform:translate(10px,-8px) rotate(.3deg)}40%{transform:translate(-8px,4px)}55%{transform:translate(6px,-3px)}75%{transform:translate(-3px,2px)}}

/* 상단 상황줄 */
.hud{position:absolute;top:calc(18px + env(safe-area-inset-top,0px));left:max(20px,env(safe-area-inset-left,0px));right:max(20px,env(safe-area-inset-right,0px));display:flex;gap:14px;align-items:baseline;font-size:14px;color:var(--dim);transition:color .4s ease}
.hud b{font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.hud .dot{width:7px;height:7px;border-radius:50%;background:#e2a33b;align-self:center;animation:blink 1.6s steps(2) infinite}
@keyframes blink{50%{opacity:.2}}
.opened .hud .dot{background:var(--rift)}

/* 부적 */
#ofuda-wrap{position:absolute;left:50%;top:54%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:18px;transition:opacity .5s ease,transform .6s cubic-bezier(.23,1,.32,1),filter .5s ease}
.ofuda{position:relative;width:clamp(112px,13vw,150px);aspect-ratio:1/2.7;background:
  repeating-linear-gradient(83deg,rgba(120,80,10,.07) 0 2px,transparent 2px 7px),
  repeating-linear-gradient(-7deg,rgba(255,255,255,.08) 0 1px,transparent 1px 9px),
  var(--paper);
  box-shadow:0 18px 40px rgba(0,0,0,.55),0 0 0 1px rgba(0,0,0,.25);
  transform:rotate(-2deg);touch-action:none;cursor:crosshair;transition:box-shadow .25s ease,filter .25s ease}
.ofuda::before{content:"";position:absolute;inset:7px;border:2px solid rgba(168,28,20,.55);box-shadow:inset 0 0 0 3px var(--paper),inset 0 0 0 4px rgba(168,28,20,.35);pointer-events:none}
.ofuda .head{position:absolute;top:16px;left:50%;transform:translateX(-50%);font-family:var(--kanji);font-weight:400;font-size:clamp(15px,1.7vw,19px);letter-spacing:.2em;color:rgba(168,28,20,.42);writing-mode:vertical-rl;height:3.2em;pointer-events:none}
.ofuda canvas{position:absolute;inset:0;width:100%;height:100%}
.ofuda .stamp{position:absolute;left:50%;bottom:9%;width:40%;aspect-ratio:1;transform:translateX(-50%) scale(1.5) rotate(4deg);border:3px solid var(--shu);color:var(--shu);font-family:var(--kanji);font-weight:400;font-size:clamp(13px,1.4vw,16px);display:grid;place-items:center;writing-mode:vertical-rl;letter-spacing:.05em;opacity:0;transition:opacity .18s ease-out,transform .18s ease-out;pointer-events:none;background:rgba(230,201,95,.6)}
.ofuda.lit{box-shadow:0 0 60px 16px rgba(255,214,120,.5),0 0 140px 40px rgba(116,239,226,.25);filter:brightness(1.12)}
.ofuda.lit .stamp{opacity:1;transform:translateX(-50%) scale(1) rotate(4deg)}
.hint{font-family:var(--kanji);font-weight:600;font-size:clamp(18px,1.6vw,22px);letter-spacing:.12em;padding-left:.12em;color:var(--ink);text-shadow:0 2px 12px rgba(0,0,0,.9);text-align:center}
.hint small{display:block;font-size:13px;color:var(--dim);margin-top:2px}
.burn{opacity:0;transform:translate(-50%,-56%) scale(.9);filter:blur(4px) brightness(1.6);pointer-events:none}

.skip{position:absolute;right:max(20px,env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));font-size:14px;color:var(--dim);padding:8px 4px;transition:color .2s ease}
.skip:hover{color:var(--ink)}
.opened .skip{opacity:0;pointer-events:none}

/* 개문 후 타이틀 */
#title{position:absolute;inset:0;pointer-events:none}
#title .t{position:absolute;right:max(7vw,env(safe-area-inset-right,0px));top:calc(10vh + env(safe-area-inset-top,0px));display:flex;flex-direction:row-reverse;gap:18px;align-items:flex-start}
#title h1{writing-mode:vertical-rl;font-family:var(--kanji);font-weight:400;font-size:clamp(60px,9vw,128px);line-height:1;letter-spacing:.04em;color:var(--ink);text-shadow:0 0 30px rgba(116,239,226,.35),0 6px 30px rgba(0,0,0,.8);white-space:nowrap}
#title .sub{writing-mode:vertical-rl;font-family:var(--kanji);font-weight:600;font-size:clamp(16px,1.7vw,21px);letter-spacing:.34em;color:#d9b45e;white-space:nowrap;padding-top:6px;text-shadow:0 2px 10px rgba(0,0,0,.9)}
#title .line{position:absolute;left:max(20px,env(safe-area-inset-left,0px));bottom:calc(28px + env(safe-area-inset-bottom,0px));max-width:30ch;font-size:clamp(16px,1.6vw,19px);line-height:1.7;text-shadow:0 2px 14px rgba(0,0,0,.95)}
#title .line button{pointer-events:auto;margin-top:14px;font-size:14px;color:var(--spirit);padding:8px 16px;border:1px solid rgba(116,239,226,.5);background:rgba(8,20,24,.6);transition:transform .16s ease-out,background .2s ease}
#title .line button:hover{background:rgba(116,239,226,.15)}
#title .line button:active{transform:scale(.97)}
#title .r{opacity:0;transform:translateY(18px);transition:opacity .7s cubic-bezier(.23,1,.32,1),transform .7s cubic-bezier(.23,1,.32,1)}
#title.on .r{opacity:1;transform:none}
#title.on .r:nth-child(2){transition-delay:.12s}
#title.on .menu{transition-delay:.3s}
#title:not(.on) .menu{pointer-events:none;visibility:hidden}
#title .menu{position:absolute;left:max(24px,env(safe-area-inset-left,0px));bottom:calc(32px + env(safe-area-inset-bottom,0px));display:flex;gap:clamp(14px,2.2vw,30px);align-items:flex-start;pointer-events:auto}
#title .menu a{writing-mode:vertical-rl;display:flex;gap:10px;align-items:center;text-decoration:none;color:var(--ink);padding:10px 4px;text-shadow:0 2px 12px rgba(0,0,0,.95);transition:color .2s ease,transform .16s ease-out}
#title .menu b{font-family:var(--body);font-weight:700;font-size:clamp(19px,1.9vw,26px);letter-spacing:.18em}
#title .menu small{font-family:var(--kanji);font-weight:600;font-size:13px;letter-spacing:.2em;color:#d9b45e;transition:color .2s ease}
#title .menu .beyond b{color:#ff6b78}
#title .menu.outer[hidden]{display:none}
#title .menu.outer .ob-back b{color:#ff6b78}
#title .menu a:active{transform:scale(.97)}
@media (hover:hover) and (pointer:fine){#title .menu a:hover{color:#ff4655}#title .menu a:hover small{color:#ff4655}}

@media (max-width:640px){
  #ofuda-wrap{top:60%}
  #title .t{right:max(18px,env(safe-area-inset-right,0px));top:calc(64px + env(safe-area-inset-top,0px))}
  .hud span.long{display:none}
}
@media (prefers-reduced-motion:reduce){
  .shake-s,.shake-m,.shake-l{animation:none}
  .hud .dot{animation:none}
  #title .r{transform:none}
}


/* ================= 메뉴 페이지 (빗물에 번지듯 넘어가는 새 화면) ================= */
#title .menu a.sel,#title .menu a.sel small{color:#ff4655}
#title .t{transition:opacity .5s ease}
#title.dim .t{opacity:.15}
#glass{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}
#page{position:fixed;inset:0;overflow-y:auto;overflow-x:hidden;z-index:40;background:#090c12;color:var(--ink);word-break:keep-all;scrollbar-width:thin;scrollbar-color:#3a4150 transparent}
#page[hidden]{display:none}
.pg-top{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:calc(14px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) 14px max(20px,env(safe-area-inset-left,0px));background:linear-gradient(#090c12 55%,rgba(9,12,18,0))}
.pg-back{font-size:15px;color:var(--ink);padding:8px 2px;transition:color .2s ease,transform .16s ease-out}
.pg-back:active{transform:scale(.97)}
@media (hover:hover) and (pointer:fine){.pg-back:hover{color:#ff4655}}
.pg-doc{font-size:13px;color:var(--dim);font-family:var(--kanji);letter-spacing:.15em}
.pg-wrap{max-width:1180px;margin:0 auto;padding:0 max(24px,env(safe-area-inset-right,0px)) 0 max(24px,env(safe-area-inset-left,0px))}
.pg-hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:40px;align-items:end;padding:56px 0 110px}
.pg-hero .lead{font-size:clamp(26px,3.4vw,44px);line-height:1.45;font-weight:700;max-width:16em;text-wrap:balance}
.pg-hero .lead em{display:block;font-style:normal;color:#ff4655}
#page.now .o,#page:not(.now) .n{display:none !important}
.pg-tools{display:flex;align-items:center;gap:18px}
.pg-style{display:flex;border:1px solid rgba(236,231,218,.35)}
.pg-style button{font-family:var(--kanji);font-size:16px;line-height:1;padding:7px 11px;color:var(--dim);transition:color .2s ease,background .2s ease}
.pg-style button[aria-pressed="true"]{background:#ece7da;color:#0a0d13}
@media (hover:hover) and (pointer:fine){.pg-style button[aria-pressed="false"]:hover{color:var(--ink)}}
.pg-hero .big{writing-mode:vertical-rl;font-family:var(--kanji);font-weight:400;font-size:clamp(90px,13vw,190px);line-height:1;letter-spacing:.04em}
.pg-sec{display:grid;grid-template-columns:clamp(70px,9vw,120px) minmax(0,1fr);gap:clamp(20px,4vw,56px);padding:0 0 150px}
.pg-sec > .k{writing-mode:vertical-rl;font-family:var(--kanji);font-weight:400;font-size:clamp(54px,7vw,96px);line-height:1;letter-spacing:.06em;position:sticky;top:90px;align-self:start}
.pg-sec > .k.red{color:#d0141e}
.pg-sec h2{font-size:clamp(24px,2.6vw,32px);line-height:1.35;margin-bottom:18px;text-wrap:balance}
.pg-sec p{max-width:36em;font-size:17px;line-height:1.85;margin-bottom:14px}
.pg-sec p.sub{font-size:14.5px;color:var(--dim)}
/* 개문 시간 띠 */
.night{margin:34px 0 12px}
.night .bar{position:relative;display:flex;height:74px}
.night .bar > div{position:relative;padding:12px 14px;font-size:15px;font-weight:700}
.night .bar small{display:block;font-weight:400;font-size:12.5px;opacity:.8;font-variant-numeric:tabular-nums}
.night .day{flex:12;background:#1d2533;color:#cfd6e2}
.night .dusk{flex:2;background:#4a2a39;color:#f0d7dc;padding:12px 8px !important}
.night .gate{flex:10;background:#24060b;color:#ff6b78}
.night .now{position:absolute;top:-10px;bottom:-10px;width:2px;background:#ff4655;box-shadow:0 0 12px #ff1e32}
.night .now::after{content:attr(data-t);position:absolute;top:-24px;left:50%;transform:translateX(-50%);font-size:12.5px;color:#ff6b78;white-space:nowrap;font-variant-numeric:tabular-nums}
.night .state{margin-top:22px;font-size:15px;color:var(--dim)}
.night .state b{color:var(--ink)}
.night .trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px;margin-top:30px}
.night .trio b{display:block;font-size:17px;margin-bottom:4px}
.night .trio p{font-size:15px;line-height:1.75;margin:0;color:#c3c9d4}
/* 괴이 그림 */
.kai{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:40px;align-items:start}
.kai figure{margin:0}
.kai figure{position:relative;aspect-ratio:2/3;max-width:100%;overflow:hidden;background:#000}
.kai figure img{display:block;width:100%;height:100%;object-fit:cover;transition:filter .7s cubic-bezier(.23,1,.32,1),transform .9s cubic-bezier(.23,1,.32,1)}
.kai figure.veiled img{filter:blur(28px) brightness(.55) saturate(.6);transform:scale(1.08)}
.kai .warn{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:#ece7da;transition:opacity .4s ease}
.kai .warn b{font-family:var(--kanji);font-weight:400;font-size:clamp(30px,3.4vw,44px);letter-spacing:.18em;padding:10px 18px 10px 26px;border:2px solid #d0141e;color:#ff4655;background:rgba(10,4,6,.55);transition:transform .16s ease-out,background .2s ease}
.kai .warn small{font-size:14px;color:#c3c9d4}
.kai .warn:active b{transform:scale(.97)}
@media (hover:hover) and (pointer:fine){.kai .warn:hover b{background:rgba(208,20,30,.18)}}
.kai figure:not(.veiled) .warn{opacity:0;pointer-events:none}
.kai figcaption{font-size:13px;color:var(--dim);margin-top:10px}
.kai ul{list-style:none;margin:26px 0 0;padding:0}
.kai li{padding:12px 0;font-size:16px;border-top:1px solid rgba(236,231,218,.12)}
.kai li b{display:inline-block;min-width:6.5em;color:#ff6b78}
/* 신기 비교 슬라이더 */
.cmp{position:relative;aspect-ratio:3/2;margin-top:30px;overflow:hidden;cursor:ew-resize;touch-action:pan-y;user-select:none;--x:50%}
.cmp img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none;max-width:none}
.cmp .top{clip-path:inset(0 calc(100% - var(--x)) 0 0)}
.cmp .line{position:absolute;top:0;bottom:0;left:var(--x);width:2px;margin-left:-1px;background:#ece7da;box-shadow:0 0 14px rgba(255,70,85,.9)}
.cmp .knob{position:absolute;top:50%;left:var(--x);width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:#ece7da;color:#0a0d13;display:grid;place-items:center;font-family:var(--kanji);font-weight:400;font-size:17px;box-shadow:0 4px 18px rgba(0,0,0,.6)}
.cmp .lb{position:absolute;bottom:16px;font-size:14px;padding:6px 12px;background:rgba(5,7,11,.72)}
.cmp .lb.l{left:16px}.cmp .lb.r{right:16px;color:#ff6b78}
.seen2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px;margin-top:26px}
.seen2 h3{font-size:17px;margin-bottom:8px}
.seen2 ul{list-style:none;margin:0;padding:0}
.seen2 li{padding:6px 0;font-size:15.5px;color:#c3c9d4}
.seen2 .yes h3{color:#ff6b78}
/* 신력 */
.pw{margin-top:30px}
.pw .grp{font-family:var(--kanji);font-size:14px;letter-spacing:.3em;color:var(--dim);margin:30px 0 6px}
.pw .row{display:grid;grid-template-columns:110px 120px minmax(0,1fr) minmax(0,.75fr);gap:6px 22px;align-items:baseline;padding:18px 0;border-top:1px solid rgba(236,231,218,.12)}
.pw .h{font-family:var(--kanji);font-weight:400;font-size:30px;line-height:1}
.pw .n{font-size:18px;font-weight:700}
.pw .d{font-size:15.5px;color:#c3c9d4}
.pw .c{font-size:14.5px;color:#ff6b78}
.pw .dark .h{color:#d0141e}
.pg-end{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;padding:36px 0 calc(48px + env(safe-area-inset-bottom,0px));border-top:2px solid #ece7da;font-size:14px;color:var(--dim)}
.pg-empty{min-height:70vh;display:grid;place-items:center;text-align:center;color:var(--dim)}
.pg-empty b{display:block;font-size:24px;color:var(--ink);margin-bottom:8px}
@media (max-width:760px){
  .pg-hero{grid-template-columns:1fr;padding:30px 0 80px}
  .pg-hero .big{writing-mode:horizontal-tb;order:-1;font-size:72px}
  .pg-sec{grid-template-columns:1fr;padding-bottom:100px}
  .pg-sec > .k{writing-mode:horizontal-tb;position:static;font-size:52px}
  .night .bar{height:auto}
  .night .bar > div{font-size:13px;padding:10px 8px}
  .night .dusk b{display:none}
  .night .trio,.kai,.seen2{grid-template-columns:1fr}
  .pw .row{grid-template-columns:64px minmax(0,1fr)}
  .pw .d,.pw .c{grid-column:2}
  .pw .h{font-size:24px}
}

/* 팔괘 */
.bagua{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:clamp(24px,4vw,56px);align-items:center;margin-top:34px}
.bg-dial svg{width:100%;max-width:520px;display:block;margin:0 auto;overflow:visible}
.bg-wheel{transform:rotate(var(--w,0deg));transform-box:view-box;transform-origin:0 0;transition:transform .7s cubic-bezier(.77,0,.175,1)}
.bg-node .up{transform:rotate(calc(var(--w,0deg) * -1));transform-box:fill-box;transform-origin:center;transition:transform .7s cubic-bezier(.77,0,.175,1)}
.bg-oct{fill:none;stroke:rgba(236,231,218,.5);stroke-width:1.5}
.bg-oct.in{stroke:rgba(236,231,218,.22)}
.bg-spoke line{stroke:rgba(236,231,218,.16);stroke-width:1}
.bg-wedge{fill:rgba(217,180,94,.12);transition:fill .4s ease}
.bagua.dark .bg-wedge{fill:rgba(208,20,30,.22)}
.bg-mark{fill:#d9b45e;transition:fill .4s ease}
.bagua.dark .bg-mark{fill:#ff4655}
.bg-core{fill:#0e121a;stroke:rgba(236,231,218,.45);stroke-width:1.5}
.bg-god{font-family:var(--kanji);font-size:46px;fill:#ece7da;text-anchor:middle}
.bg-node{cursor:pointer;outline:none}

.bg-detail{min-height:280px}
.pd-top{display:flex;align-items:center;gap:20px;margin-bottom:20px}
.pd-h{font-family:var(--kanji);font-size:clamp(56px,6vw,84px);line-height:1;color:#d9b45e;white-space:nowrap}
.bg-detail.dark .pd-h{color:#ff4655}
.pd-n{font-size:22px;font-weight:700}

.pd-d{font-size:17px;line-height:1.85;margin-bottom:22px}

/* 괴이 탭 */
.kai .more{margin-top:22px;font-size:15px;color:#ff6b78;padding:10px 16px;border:1px solid rgba(255,70,85,.55);transition:background .2s ease,transform .16s ease-out}
.kai .more:active{transform:scale(.97)}
@media (hover:hover) and (pointer:fine){.kai .more:hover{background:rgba(255,70,85,.12)}}
.grades{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));margin-top:30px}
.grades > div{padding:22px 18px 24px}
.grades .gh{display:block;font-family:var(--kanji);font-size:clamp(44px,5vw,64px);line-height:1;margin-bottom:14px}
.grades p{margin:0;font-size:14.5px;line-height:1.7;color:#d5d9e0}
.grades .g0{background:#121722}.grades .g0 .gh{color:#aab1bd}
.grades .g1{background:#17151f}.grades .g1 .gh{color:#c9a9b0}
.grades .g2{background:#22121a}.grades .g2 .gh{color:#e07d88}
.grades .g3{background:#2e0f15}.grades .g3 .gh{color:#ff4655}
.grades .g4{background:#4a0a10}.grades .g4 .gh{color:#ffd9dc;text-shadow:0 0 18px rgba(255,40,60,.8)}
.pg-sec .hint{font-family:var(--body);font-size:14px;letter-spacing:0;padding-left:0;text-align:left;text-shadow:none;color:var(--dim);margin-bottom:6px}
.fam{margin-top:34px}
.fam h3{display:flex;align-items:baseline;gap:12px;margin-bottom:6px}
.fam .fh{font-family:var(--kanji);font-weight:400;font-size:26px;color:var(--fc)}
.fam .fk{font-size:15px;color:var(--dim);font-weight:400}
.fam .fd{font-size:15.5px;color:#c3c9d4;margin-bottom:0}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.chip{display:flex;align-items:baseline;gap:8px;padding:9px 14px;border:1px solid color-mix(in srgb,var(--fc) 55%,transparent);background:color-mix(in srgb,var(--fc) 8%,transparent);color:var(--fc);transition:background .2s ease,color .2s ease,transform .16s ease-out}
.chip b{font-family:var(--kanji);font-weight:400;font-size:20px;line-height:1}
.chip small{font-size:13px;opacity:.85}
.chip.on{background:var(--fc);color:#0a0d13}
.chip:active{transform:scale(.97)}
.fam .ex{min-height:3.4em;margin:14px 0 0;font-size:15.5px;line-height:1.75;color:var(--ink);max-width:40em}
.fam .ex b{font-family:var(--kanji);font-weight:400;color:var(--fc);margin-right:12px}
@media (max-width:760px){.grades{grid-template-columns:1fr}.grades > div{display:grid;grid-template-columns:56px minmax(0,1fr);gap:14px;align-items:center;padding:16px}.grades .gh{margin:0;font-size:40px}}

/* 무녀 품계 사다리 */
.ladder{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));margin-top:2px;position:relative}
.ladder .lad-head{position:absolute;top:-30px;right:0;font-family:var(--kanji);font-size:14px;letter-spacing:.2em;color:var(--dim);display:none}
.ladder .lad{padding:14px 18px 16px;border-top:2px solid rgba(9,12,18,.9)}
.ladder .lad > span{display:block;font-family:var(--kanji);font-size:15px;color:var(--dim);margin-bottom:8px;letter-spacing:.1em}
.ladder ol{list-style:none;margin:0;padding:0;display:flex;gap:6px}
.ladder li{flex:1;text-align:center;font-family:var(--kanji);font-size:14px;padding:6px 0;background:rgba(236,231,218,.06);color:#d5d9e0}
.ladder li:nth-child(2){background:rgba(236,231,218,.1)}
.ladder li:nth-child(3){background:rgba(236,231,218,.16);color:#fff}
.ladder .g0{background:#0f131c}.ladder .g1{background:#14121b}.ladder .g2{background:#1d1016}.ladder .g3{background:#270c12}
.ladder .ten{background:linear-gradient(#ece7da,#d9cfb4);color:#0a0d13}
.ladder .ten > span{font-size:34px;line-height:1;color:#0a0d13;margin-bottom:6px}
.ladder .ten p{margin:0;font-size:13.5px;color:#3a3f4c}
@media (max-width:760px){.ladder{grid-template-columns:1fr;margin-top:14px}.ladder .lad{display:grid;grid-template-columns:56px minmax(0,1fr);gap:14px;align-items:center;padding:12px 16px}.ladder .lad > span{margin:0}.ladder .ten{grid-template-columns:56px minmax(0,1fr)}}

/* ================= 세력 탭: 세력마다 다른 화면 ================= */
.fx{position:relative;width:100vw;margin-left:calc(50% - 50vw);min-height:100svh;display:flex;align-items:center;overflow:hidden;--ink:#ece7da;--sub:#aab1bd;--acc:#d9b45e;color:var(--ink)}
.fx-in{position:relative;z-index:2;width:100%;max-width:1180px;margin:0 auto;padding:110px max(24px,env(safe-area-inset-right,0px)) 110px max(24px,env(safe-area-inset-left,0px));display:grid;grid-template-columns:auto minmax(0,1fr);gap:clamp(28px,6vw,90px);align-items:center}
.fx-deco{position:absolute;inset:0;pointer-events:none;z-index:1}
.fx-hj{display:block;writing-mode:vertical-rl;font-family:var(--kanji);font-size:clamp(96px,13vw,190px);line-height:1;letter-spacing:.04em;color:var(--acc);white-space:nowrap}
.fx-side{font-family:var(--kanji);font-size:15px;letter-spacing:.3em;color:var(--sub);margin:0 0 6px}
.fx h2{font-size:clamp(28px,3.2vw,40px);line-height:1.3;margin:0 0 22px;color:var(--ink)}
.fx-motto{font-family:var(--kanji);font-size:clamp(20px,2.2vw,28px);line-height:1.6;margin:0 0 20px;color:var(--acc);max-width:22em;text-wrap:balance}
.fx-desc{font-size:17px;line-height:1.85;max-width:34em;margin:0 0 34px;color:var(--ink)}
.fx-m{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:0 28px;max-width:640px}
.fx-m li{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-top:1px solid color-mix(in srgb,var(--ink) 20%,transparent);font-size:15px}
.fx-m span{color:var(--sub)}
.fx-m b{font-weight:400;color:var(--ink)}

/* 세력 목차 */
.fx-rail{position:fixed;right:max(44px,env(safe-area-inset-right,0px));top:50%;transform:translateY(-50%);z-index:6;display:flex;flex-direction:column;gap:6px;opacity:0;pointer-events:none;transition:opacity .3s ease}
.fx-rail.show{opacity:1;pointer-events:auto}
.fx-rail a{writing-mode:vertical-rl;font-family:var(--kanji);font-size:14px;letter-spacing:.1em;text-decoration:none;color:rgba(236,231,218,.45);padding:6px 4px;transition:color .25s ease}
.fx-rail a.on{color:#ece7da}
.fx-rail[data-on="kamishiro"] a,.fx-rail[data-on="mumyeong"] a{color:rgba(20,20,26,.35)}
.fx-rail[data-on="kamishiro"] a.on{color:#b8231a}.fx-rail[data-on="mumyeong"] a.on{color:#0a0a0c}
@media (max-width:760px){.fx-rail{display:none}}

/* 神祇廳: 서류철, 남색과 은 */
.fx-shingi{background:#0c1626;--ink:#dfe5ee;--sub:#8796ad;--acc:#c9d3e0}
.fx-shingi .fx-deco{background:repeating-linear-gradient(0deg,transparent 0 47px,rgba(201,211,224,.07) 47px 48px),repeating-linear-gradient(90deg,transparent 0 47px,rgba(201,211,224,.04) 47px 48px)}
.fx-shingi .fx-deco::after{content:"";position:absolute;right:8%;top:50%;width:min(46vw,520px);aspect-ratio:1;transform:translateY(-50%);border-radius:50%;border:2px solid rgba(201,211,224,.14);box-shadow:inset 0 0 0 18px #0c1626,inset 0 0 0 20px rgba(201,211,224,.1)}
.fx-shingi .fx-hj{letter-spacing:.2em}

/* 神代神社: 흰 종이, 주홍 기둥, 금 문장 */
.fx-kamishiro{background:#f1ece0;--ink:#1d1a1c;--sub:#7d6f62;--acc:#b8231a}
.fx-kamishiro .fx-deco{background:linear-gradient(90deg,#b8231a 0 26px,transparent 26px calc(100% - 26px),#b8231a calc(100% - 26px)),repeating-linear-gradient(88deg,rgba(120,90,40,.05) 0 1px,transparent 1px 7px)}
.fx-kamishiro .fx-deco::after{content:"";position:absolute;left:0;right:0;top:0;height:14px;background:repeating-linear-gradient(115deg,#d6c493 0 10px,#bba873 10px 20px)}
.fx-kamishiro .fx-m li{border-top-color:rgba(29,26,28,.18)}

/* 明月會: 흑금, 보름달 */
.fx-myeongwol{background:#0a0806;--ink:#efe4c8;--sub:#9b8a62;--acc:#d4b25a}
.fx-myeongwol .fx-deco::after{content:"";position:absolute;left:-6vw;top:50%;width:min(70vw,760px);aspect-ratio:1;transform:translateY(-50%);border-radius:50%;background:#e9d9a6;opacity:.13;box-shadow:0 0 120px 30px rgba(233,217,166,.08)}
.fx-myeongwol .fx-in{grid-template-columns:minmax(0,1fr) auto}
.fx-myeongwol .fx-name{order:2}

/* 어스름: 해 질 녘 */
.fx-eoseureum{background:linear-gradient(180deg,#1c1638 0%,#3b2552 38%,#7b3f5a 70%,#c46c3c 100%);--ink:#f6ebe2;--sub:#d3b8c6;--acc:#ffc58f}
.fx-eoseureum .fx-deco::after{content:"";position:absolute;right:14%;top:22%;width:46px;height:64px;border-radius:12px 12px 16px 16px;background:linear-gradient(#c2303a 0 50%,#2f4fa0 50%);box-shadow:0 0 50px 14px rgba(255,170,110,.35)}
.fx-eoseureum .fx-hj{font-family:var(--body);letter-spacing:.2em}

/* 夜警事務所: 콘크리트와 간판 */
.fx-yagyeong{background:#18191c;--ink:#e8e4dc;--sub:#8e8a82;--acc:#e3a35f}
.fx-yagyeong .fx-deco{background:repeating-linear-gradient(0deg,rgba(255,255,255,.015) 0 2px,transparent 2px 5px)}
.fx-yagyeong .fx-name{padding:18px 14px;border:3px solid #e3a35f;box-shadow:0 0 0 6px #18191c,0 0 0 7px rgba(227,163,95,.35),0 0 40px rgba(227,163,95,.25)}
.fx-yagyeong .fx-hj{font-size:clamp(64px,8vw,116px)}

/* 落花: 검정과 떨어지는 동백 */
.fx-nakhwa{background:#090507;--ink:#ead9da;--sub:#8c6b6f;--acc:#c4192a}
.fx-nakhwa .fx-deco i{position:absolute;width:26px;height:26px;border-radius:50% 50% 50% 0;background:#a5121f;transform:rotate(-45deg);opacity:.75;animation:fall 9s linear infinite}
@keyframes fall{from{transform:translateY(-12vh) rotate(-45deg)}to{transform:translateY(112vh) rotate(240deg)}}

/* 無名敎: 순백, 아래에서 번지는 먹 */
.fx-mumyeong{background:#f4f3ef;--ink:#121214;--sub:#77767a;--acc:#121214}
.fx-mumyeong .fx-deco{background:radial-gradient(120% 60% at 30% 118%,#000 0 30%,transparent 62%),radial-gradient(90% 50% at 80% 115%,#000 0 26%,transparent 60%);filter:url(#ink)}
.fx-mumyeong .fx-m li{border-top-color:rgba(18,18,20,.18)}
.fx-mumyeong .fx-hj{color:#121214}

@media (max-width:760px){
  .fx{min-height:0}
  .fx-in,.fx-myeongwol .fx-in{grid-template-columns:minmax(0,1fr);padding-top:90px;padding-bottom:90px}
  .fx-name,.fx-body{min-width:0}
  .fx-m{grid-template-columns:minmax(0,1fr)}
  .fx-yagyeong .fx-hj{font-size:clamp(40px,11vw,60px)}
  .fx-myeongwol .fx-name{order:0}
  .fx-hj{writing-mode:horizontal-tb;font-size:clamp(56px,16vw,80px)}
  .fx-yagyeong .fx-name{justify-self:start}
  .fx-kamishiro .fx-deco{background:linear-gradient(90deg,#b8231a 0 10px,transparent 10px calc(100% - 10px),#b8231a calc(100% - 10px))}
}
@media (prefers-reduced-motion:reduce){.fx-nakhwa .fx-deco i{animation:none}}

/* ================= 인물 탭: 세력 화면 + 캐릭터 카드 ================= */
.fx-people .fx-in{align-items:start}
.fx-people .fx-hj{font-size:clamp(80px,10vw,150px)}
.fx-people h2{margin-bottom:28px}
.pcs{display:grid;grid-template-columns:repeat(auto-fill,minmax(172px,1fr));gap:18px}
.pc{background:color-mix(in srgb,var(--ink) 6%,transparent);border-top:3px solid var(--acc);display:flex;flex-direction:column;min-width:0}
.pc-ph{position:relative;aspect-ratio:3/4;max-width:100%;overflow:hidden;background:color-mix(in srgb,var(--ink) 8%,transparent)}
.pc-ph img{width:100%;height:100%;object-fit:cover;object-position:50% 12%;display:block}
.pc-ph.empty img{display:none}
.pc-ph.empty::after{content:attr(data-hj);position:absolute;inset:0;display:grid;place-items:center;font-family:var(--kanji);font-size:72px;color:var(--acc);opacity:.28}
.pc-in{padding:12px 14px 16px}
.pc-role{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--sub);margin:0 0 4px}
.pc-role span{font-family:var(--kanji);color:var(--acc);white-space:nowrap}
.pc h3{font-size:18px;line-height:1.35;margin:0;color:var(--ink)}
.pc-hj{font-family:var(--kanji);font-size:14px;color:var(--sub);margin:2px 0 0}
.pc-alias{font-size:14px;color:var(--acc);margin:10px 0 0}
.pc-pw{font-size:13px;color:var(--sub);margin:4px 0 0}
.pc.blank h3{color:var(--sub);font-weight:400;font-size:16px}
.fx-kamishiro .pc,.fx-mumyeong .pc{background:rgba(255,255,255,.55)}
.fx-yagyeong .pc{border-top-color:#e3a35f;box-shadow:inset 0 0 0 1px rgba(227,163,95,.18)}
@media (max-width:760px){.pcs{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.pc h3{font-size:16px}.fx-people .fx-hj{font-size:clamp(56px,16vw,80px)}.fx-people.fx-yagyeong .fx-hj{font-size:clamp(40px,11vw,60px)}}

/* ================= 인물 프로필 창 ================= */
.pc[data-code]{cursor:pointer;transition:transform .18s cubic-bezier(.23,1,.32,1)}
.pc[data-code]:active{transform:scale(.98)}
@media (hover:hover) and (pointer:fine){.pc[data-code]:hover{transform:translateY(-3px)}}
.pc[data-code]:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
#pfBox{position:fixed;inset:0;z-index:50;display:grid;place-items:start center;overflow-y:auto;overscroll-behavior:contain;padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:rgba(4,5,9,.78);opacity:0;transition:opacity .22s ease}
#pfBox.on{opacity:1}
#pfBox[hidden]{display:none}
.pf{position:relative;width:min(1000px,100%);margin-block:auto;display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);color:var(--ink);background:#10141c;transform:translateY(14px) scale(.98);transition:transform .32s cubic-bezier(.23,1,.32,1);scrollbar-width:thin}
#pfBox.on .pf{transform:none}
.pf-deco{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.pf > *:not(.pf-deco){position:relative;z-index:1}
.pf-x{position:absolute !important;top:12px;right:12px;z-index:3 !important;font-size:14px;padding:8px 12px;color:inherit;background:color-mix(in srgb,var(--ink) 10%,transparent);transition:background .2s ease,transform .16s ease-out}
.pf-x:active{transform:scale(.97)}
.pf-ph{aspect-ratio:3/4;max-width:100%;background:color-mix(in srgb,var(--ink) 8%,transparent);overflow:hidden}
.pf-ph img{width:100%;height:100%;object-fit:cover;object-position:50% 12%;display:block}
.pf-ph.empty img{display:none}
.pf-ph.empty::after{content:attr(data-hj);position:absolute;inset:0;display:grid;place-items:center;font-family:var(--kanji);font-size:120px;color:var(--acc);opacity:.25}
.pf-in{padding:46px clamp(22px,4vw,48px) 40px;display:flex;flex-direction:column}
.pf-alias{font-family:var(--kanji);font-size:17px;color:var(--acc);margin:0 0 6px;letter-spacing:.06em}
.pf h2{font-size:clamp(28px,3vw,38px);line-height:1.25;margin:0}
.pf-hj{font-family:var(--kanji);font-size:18px;color:var(--sub);margin:4px 0 0}
.pf-meta{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;margin:26px 0 22px;border-top:1px solid color-mix(in srgb,var(--ink) 22%,transparent);border-bottom:1px solid color-mix(in srgb,var(--ink) 22%,transparent)}
.pf-meta div{padding:10px 0}
.pf-meta dt{font-size:12.5px;color:var(--sub)}
.pf-meta dd{margin:2px 0 0;font-size:15px}
.pf-intro{font-size:16px;line-height:1.8;margin:0 0 20px;max-width:30em}
.pf-soon{color:var(--sub)}
.pf-row{display:grid;grid-template-columns:56px minmax(0,1fr);gap:12px;padding:6px 0;font-size:15px}
.pf-row span{color:var(--sub)}
.pf-row b{font-weight:400}
.pf-own{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center;margin-top:16px;padding:16px 18px;background:color-mix(in srgb,var(--acc) 12%,transparent)}
.pf-own-hj{font-family:var(--kanji);font-size:34px;line-height:1;color:var(--acc);white-space:nowrap}
.pf-own b{font-size:16px}
.pf-own p{margin:2px 0 0;font-size:14.5px;line-height:1.65}
.pf-line{margin:auto 0 0;padding-top:28px;font-family:var(--kanji);font-size:clamp(19px,2vw,23px);line-height:1.6;color:var(--acc)}
.pf-line::before{content:"「"}.pf-line::after{content:"」"}

/* K1 아마네: 진홍 하오리와 금실, 학, 방울 */
.pf-K1{--ink:#f6ead6;--sub:#d6b48a;--acc:#e9c46a;background:#5e0f12;box-shadow:inset 0 0 0 10px #5e0f12,inset 0 0 0 11px #c9a24a,inset 0 0 0 16px #5e0f12,inset 0 0 0 17px rgba(201,162,74,.5)}
.pf-K1 .pf-deco{background:radial-gradient(120% 80% at 100% 0,rgba(233,196,106,.16),transparent 55%),repeating-linear-gradient(60deg,rgba(233,196,106,.05) 0 2px,transparent 2px 22px)}
.pf-K1 .d-crane{position:absolute;right:-30px;bottom:-40px;width:340px;height:340px;border-radius:50%;border:2px solid rgba(233,196,106,.22);box-shadow:0 0 0 22px rgba(233,196,106,.05),0 0 0 44px rgba(233,196,106,.04)}
.pf-K1 .d-bell{position:absolute;top:24px;width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff4c2,#c9a24a 60%,#7b5b1d);animation:bell 2.8s ease-in-out infinite}
.pf-K1 .b1{right:150px}.pf-K1 .b2{right:124px;top:34px;animation-delay:-.8s}.pf-K1 .b3{right:98px;animation-delay:-1.6s}
@keyframes bell{50%{transform:translateY(4px) rotate(8deg)}}
.pf-K1 .pf-ph{margin:17px 0 17px 17px}
.pf-K1 .pf-meta{border-color:rgba(233,196,106,.35)}

/* K2 카나데: 연습장 종이, 가로지르는 붉은 실, 지운 흔적 */

/* Y1 히비키: 비 오는 밤거리, 세로 네온 간판, 숨긴 은방울 */
.pf-Y1{--ink:#f0ebe2;--sub:#a59c8c;--acc:#e8b878;background:#16191f}
.pf-Y1 .d-neon{position:absolute;right:26px;top:70px;font-style:normal;writing-mode:vertical-rl;font-family:var(--kanji);font-size:26px;letter-spacing:.18em;color:#ffd7a0;text-shadow:0 0 6px #ff9c3a,0 0 18px rgba(255,140,50,.7);opacity:.55}
.pf-Y1 .d-bell2{position:absolute;right:76px;top:0;width:1px;height:62px;background:rgba(220,220,230,.4)}
.pf-Y1 .d-bell2::after{content:"";position:absolute;left:-7px;bottom:-12px;width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,#c7ccd6 55%,#7c828e);animation:bell 3.2s ease-in-out infinite}
.pf-Y1 .pf-ph{filter:contrast(1.04)}
.pf-Y1 .pf-hj{color:#c24a4a}
.pf-Y1 .pf-line{color:#f0ebe2}
.pf-Y1 .pf-in{padding-right:72px}

/* Y2 은결(天): 위에서 드리운 검은 머리칼, 희미한 天 */
.pf-Y2{--ink:#17181c;--sub:#6e7078;--acc:#a8161e;background:#e4e5e9}
.pf-Y2 .d-hair{position:absolute;left:0;right:0;top:0;height:46%;background:repeating-linear-gradient(90deg,rgba(14,15,18,.85) 0 2px,transparent 2px 7px,rgba(14,15,18,.6) 7px 8px,transparent 8px 13px);-webkit-mask:linear-gradient(180deg,#000 10%,transparent);mask:linear-gradient(180deg,#000 10%,transparent);opacity:.55}
.pf-Y2 .d-ten{position:absolute;right:-10px;bottom:-60px;font-style:normal;font-family:var(--kanji);font-size:300px;line-height:1;color:rgba(23,24,28,.06)}
.pf-Y2 .d-knot{position:absolute;right:42px;top:56%;width:14px;height:14px;border:3px solid #a8161e;border-radius:50% 50% 50% 0;transform:rotate(-45deg)}
.pf-Y2 .d-knot::after{content:"";position:absolute;left:4px;top:12px;width:2px;height:40px;background:#a8161e;transform:rotate(45deg);transform-origin:top}
.pf-Y2 .pf-in{background:rgba(228,229,233,.85)}
.pf-Y2 .pf-meta div:last-child dd{font-family:var(--kanji);font-size:22px;color:#a8161e;line-height:1}
.pf-Y2 .pf-own{background:transparent;border-top:1px solid #17181c;border-bottom:1px solid #17181c}
.pf-Y2 .pf-line{color:#17181c;font-size:clamp(28px,3vw,36px)}
.pf-Y2 .pf-x{background:rgba(23,24,28,.08)}

/* Y3 모아: 영수증 종이, 금빛 뱀 */
.pf-Y3{--ink:#1f2a26;--sub:#73827b;--acc:#b8902a;background:#e9f0ec}
.pf-Y3 .d-receipt{position:absolute;right:30px;top:0;width:96px;height:68%;background:#fffdf7 repeating-linear-gradient(180deg,transparent 0 17px,rgba(31,42,38,.12) 17px 18px);box-shadow:0 2px 8px rgba(0,0,0,.08);-webkit-mask:linear-gradient(#000,#000) top/100% calc(100% - 8px) no-repeat,conic-gradient(from -45deg at 50% 100%,#000 90deg,transparent 0) bottom/12px 8px repeat-x;mask:linear-gradient(#000,#000) top/100% calc(100% - 8px) no-repeat,conic-gradient(from -45deg at 50% 100%,#000 90deg,transparent 0) bottom/12px 8px repeat-x;opacity:.75}
.pf-Y3 .d-snake{position:absolute;left:44%;top:-4%;width:60px;height:108%}
.pf-Y3 .d-snake path{fill:none;stroke:#c9a23a;stroke-width:3;vector-effect:non-scaling-stroke;opacity:.5}
.pf-Y3 .pf-in{background:rgba(233,240,236,.8)}
.pf-Y3 .pf-meta dd{font-variant-numeric:tabular-nums}
.pf-Y3 .pf-line{color:#1f2a26}
.pf-Y3 .pf-x{background:rgba(31,42,38,.08)}

/* R1 츠바키: 검은 바탕에 통째로 지는 붉은 동백 */
.pf-R1{--ink:#f1e6e4;--sub:#a58c8a;--acc:#d6273a;background:#0d0a0b}
.pf-R1 .d-cam{position:absolute;width:38px;height:38px;border-radius:50%;background:radial-gradient(circle,#f2c94c 0 18%,#c81d2f 20%,#9e1222 62%,#6e0b17 100%);box-shadow:0 0 0 3px rgba(110,11,23,.5);animation:camfall 9s linear infinite;opacity:0}
.pf-R1 .c1{right:16%;animation-delay:0s}.pf-R1 .c2{right:34%;width:28px;height:28px;animation-delay:-3s}.pf-R1 .c3{right:6%;width:32px;height:32px;animation-delay:-5.5s}.pf-R1 .c4{left:48%;width:24px;height:24px;animation-delay:-7.5s}
@keyframes camfall{0%{top:-40px;opacity:0;transform:rotate(0)}8%{opacity:.85}85%{opacity:.85}100%{top:105%;opacity:0;transform:rotate(200deg)}}
.pf-R1 .pf-hj{color:#d6273a}
.pf-R1 .pf-own{background:rgba(214,39,58,.1);border-left:3px solid #d6273a}
.pf-R1 .pf-line{color:#f1e6e4}

/* R2 히나: 검게 잠식된 붉은 균열 */
.pf-R2{--ink:#f1ecf6;--sub:#a597b6;--acc:#ff4d6a;background:#141019}
.pf-R2 .d-crack{position:absolute;inset:0;width:100%;height:100%}
.pf-R2 .d-crack path{fill:none;stroke:#ff3b5a;stroke-width:2;vector-effect:non-scaling-stroke;filter:drop-shadow(0 0 4px rgba(255,40,80,.9));opacity:.7}
.pf-R2 .pf-alias{color:#c9a8f0}
.pf-R2 .pf-hj{color:#c9a8f0}
.pf-R2 .pf-line{color:#ffd0dc}
.pf-R2 .pf-in{background:rgba(20,16,25,.7)}

/* R3 사요: 눈 내리는 신사, 검은 우산 아래, 흰 동백 하나 */
.pf-R3{--ink:#e9edf3;--sub:#98a2b2;--acc:#f3f3f3;background:#1a1f28}
.pf-R3 .d-brella{position:absolute;left:-10%;right:-10%;top:-62%;height:100%;border-radius:50%;background:repeating-conic-gradient(from 0deg at 50% 100%,#0c0e12 0 9deg,#11141a 9deg 18deg);box-shadow:0 6px 18px rgba(0,0,0,.4)}
.pf-R3 .d-snow2{position:absolute;inset:0;background-image:radial-gradient(circle,rgba(255,255,255,.7) 1.3px,transparent 2px),radial-gradient(circle,rgba(255,255,255,.45) 1px,transparent 1.6px);background-size:80px 90px,47px 61px;background-position:10px 0,30px 20px;-webkit-mask:linear-gradient(180deg,transparent 36%,#000 60%);mask:linear-gradient(180deg,transparent 36%,#000 60%)}
.pf-R3 .d-wcam{position:absolute;right:30px;bottom:26px;width:34px;height:34px;border-radius:50%;background:radial-gradient(circle,#f2c94c 0 18%,#fbfbf8 20%,#e2e4e6 70%);box-shadow:0 0 14px rgba(255,255,255,.4)}
.pf-R3 .pf-in{padding-top:90px;background:linear-gradient(180deg,transparent,rgba(26,31,40,.7) 30%)}
.pf-R3 .pf-own{background:rgba(255,255,255,.06)}
.pf-R3 .pf-line{color:#e9edf3}

/* N1 무명: 순백이 아래부터 먹물로 물들고, 금 간 검은 후광 */
.pf-N1{--ink:#1a1517;--sub:#7b6f74;--acc:#c0102a;background:#f6f3f1}
.pf-N1 .d-halo{position:absolute;right:40px;top:30px;width:140px;height:140px;border-radius:50%;border:4px solid #141012;-webkit-mask:conic-gradient(#000 0 70deg,transparent 70deg 78deg,#000 78deg 200deg,transparent 200deg 206deg,#000 206deg);mask:conic-gradient(#000 0 70deg,transparent 70deg 78deg,#000 78deg 200deg,transparent 200deg 206deg,#000 206deg);opacity:.75}
.pf-N1 .d-inkup{position:absolute;left:0;width:45%;bottom:0;height:40%;background:linear-gradient(0deg,#0d0a0b 0%,rgba(13,10,11,.75) 35%,transparent 100%)}
.pf-N1 .pf-in{padding-bottom:70px}
.pf-N1 .pf-meta div:last-child dd{color:#c0102a;font-family:var(--kanji);font-size:20px;line-height:1}
.pf-N1 .pf-own{background:rgba(192,16,42,.08);border-left:3px solid #c0102a}
.pf-N1 .pf-line{color:#1a1517}
.pf-N1 .pf-x{background:rgba(26,21,23,.08)}

/* N2 소복: 순백, 검은 처형검 한 자루 */
.pf-N2{--ink:#1d1d20;--sub:#85868c;--acc:#1d1d20;background:#fbfbfa}
.pf-N2 .d-blade{position:absolute;left:-6%;right:-6%;bottom:22px;height:16px;background:linear-gradient(180deg,#2a2b30,#0d0d10);clip-path:polygon(0 30%,92% 0,100% 50%,92% 100%,0 70%);transform:rotate(-6deg);opacity:.85}
.pf-N2 .pf-ph{filter:grayscale(.2)}
.pf-N2 h2{letter-spacing:.14em}
.pf-N2 .pf-own{background:transparent;border-top:1px solid #1d1d20;border-bottom:1px solid #1d1d20}
.pf-N2 .pf-line{color:#1d1d20}
.pf-N2 .pf-in{padding-bottom:70px}
.pf-N2 .pf-x{background:rgba(29,29,32,.07)}

/* N3 코토하: 레이스 베일과 빽빽한 먹 글씨 */
.pf-N3{--ink:#1c1a1d;--sub:#857f88;--acc:#b8902a;background:#f1efec}
.pf-N3 .d-lace{position:absolute;left:0;right:0;top:0;height:36px;background:radial-gradient(circle at 12px 0,transparent 11px,rgba(28,26,29,.12) 12px 13px,transparent 14px) 0 0/24px 24px repeat-x,radial-gradient(circle,rgba(28,26,29,.12) 1.4px,transparent 2px) 0 8px/12px 12px}
.pf-N3 .d-script{position:absolute;right:20px;top:60px;bottom:30px;width:90px;background:repeating-linear-gradient(90deg,transparent 0 10px,rgba(28,26,29,.08) 10px 22px,transparent 22px 30px),repeating-linear-gradient(180deg,transparent 0 6px,rgba(241,239,236,1) 6px 9px);opacity:.9}
.pf-N3 .pf-line{color:#1c1a1d;letter-spacing:.06em}
.pf-N3 .pf-own{background:rgba(184,144,42,.08)}
.pf-N3 .pf-in{padding-right:120px}
.pf-N3 .pf-x{background:rgba(28,26,29,.07)}

/* N4 백아: 빽빽한 기도문 위로 흰 나방 */
.pf-N4{--ink:#2a2a2e;--sub:#8f8f96;--acc:#55555c;background:#ededee}
.pf-N4 .d-pray{position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 22px,rgba(42,42,46,.06) 22px 30px);-webkit-mask:repeating-linear-gradient(180deg,#000 0 10px,transparent 10px 14px);mask:repeating-linear-gradient(180deg,#000 0 10px,transparent 10px 14px)}
.pf-N4 .d-moth{position:absolute;width:26px;height:16px;animation:moth 6s ease-in-out infinite}
.pf-N4 .d-moth::before,.pf-N4 .d-moth::after{content:"";position:absolute;top:0;width:13px;height:16px;background:#fff;border-radius:80% 20% 60% 40%;box-shadow:0 1px 5px rgba(0,0,0,.35)}
.pf-N4 .d-moth::before{left:0;transform-origin:right center;animation:wing .25s ease-in-out infinite alternate}
.pf-N4 .d-moth::after{right:0;border-radius:20% 80% 40% 60%;transform-origin:left center;animation:wing .25s ease-in-out infinite alternate-reverse}
.pf-N4 .m1{right:14%;top:14%}.pf-N4 .m2{right:30%;top:30%;animation-delay:-2s;transform:scale(.7)}.pf-N4 .m3{right:8%;top:44%;animation-delay:-4s;transform:scale(.85)}
@keyframes moth{50%{translate:-14px -10px}}
@keyframes wing{to{transform:scaleX(.4)}}
.pf-N4 .pf-in{background:rgba(237,237,238,.82)}
.pf-N4 .pf-line{color:#2a2a2e}
.pf-N4 .pf-x{background:rgba(42,42,46,.07)}

/* 관계록 */
.pf-rel{margin-top:30px}
.pf-rel h3{font-size:17px;font-weight:700;margin:0 0 10px;padding-bottom:12px;border-bottom:1px solid color-mix(in srgb,var(--ink) 22%,transparent)}
.pf-rel-i{padding:12px 0 14px;border-bottom:1px solid color-mix(in srgb,var(--ink) 14%,transparent)}
.pf-rel-i:last-child{border-bottom:0}
.pf-rel-n{font:inherit;color:var(--ink);padding:0;text-align:left;background:none}
.pf-rel-n b{font-size:15.5px;font-weight:700}
.pf-rel-i p{margin:5px 0 0;font-size:14.5px;line-height:1.7;color:color-mix(in srgb,var(--ink) 72%,transparent)}

/* 괴이 도감 카드 */
.kds{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px;margin-top:22px}
.kd-h2{margin-top:56px}
.kd{position:relative;background:#11141b;border-top:2px solid #3a2228;min-width:0;transition:filter .4s ease}
.kd-ph{position:relative;aspect-ratio:1216/832;overflow:hidden;background:#0b0d12}
.kd-ph img{width:100%;height:100%;object-fit:cover;display:block;transition:filter .4s ease}
.kd-ph.empty img{display:none}
.kd-ph.empty::after{content:attr(data-no);position:absolute;inset:0;display:grid;place-items:center;font-family:var(--kanji);font-size:54px;color:rgba(208,20,30,.25)}
.kd-in{padding:12px 14px 14px}
.kd-no{margin:0;font-size:12px;color:var(--dim);letter-spacing:.1em}
.kd h3{margin:2px 0 8px;font-size:18px;line-height:1.35;color:#ece7da}
.kd h3 span{font-family:var(--kanji);font-size:14px;color:#8f97a6;margin-left:8px}
.kd-tags{display:flex;flex-wrap:wrap;gap:5px;margin:0 0 12px}
.kd-tags span{font-family:var(--kanji);font-size:12.5px;padding:2px 7px;border:1px solid rgba(236,231,218,.18);color:#c3c9d4}
.kd-tags .hb{border-color:rgba(217,180,94,.45);color:#d9b45e}
.kd-ft{display:flex;align-items:center;gap:8px}
.kd-g{font-family:var(--kanji);font-size:17px;width:30px;height:30px;display:grid;place-items:center;background:#121722;color:#aab1bd}
.kd-g.g1{background:#17151f;color:#c9a9b0}.kd-g.g2{background:#22121a;color:#e07d88}.kd-g.g3{background:#2e0f15;color:#ff4655}.kd-g.g4{background:#4a0a10;color:#ffd9dc}
.kd-t{font-size:13px;padding:3px 8px;border-radius:2px}
.kd-t .o{font-family:var(--kanji);font-size:15px}
.t-害{background:rgba(208,20,30,.16);color:#ff6b75}.t-無{background:rgba(195,201,212,.1);color:#c3c9d4}.t-戱{background:rgba(232,180,80,.14);color:#e8b450}
.kd-chk{margin-left:auto;display:inline-flex;align-items:center;gap:5px;font-size:12.5px;color:var(--dim);cursor:pointer;padding:6px 0}
.kd-chk input{width:14px;height:14px;margin:0;accent-color:#d0141e;cursor:pointer}
.kd-chk .o{font-family:var(--kanji);font-size:14px}
.kd-stamp{position:absolute;left:50%;top:50%;width:112px;height:112px;margin:-56px 0 0 -56px;display:grid;place-items:center;font-style:normal;font-family:var(--kanji);font-size:44px;line-height:1;writing-mode:vertical-rl;letter-spacing:.06em;color:#ee2430;border:4px double #ee2430;border-radius:6px;background:rgba(30,4,8,.35);text-shadow:0 0 6px rgba(238,36,48,.5);transform:rotate(-12deg);opacity:0;pointer-events:none}
.kd.done .kd-stamp{opacity:.92}
.kd.done .kd-ph.empty::after{opacity:0}
.kd.done .kd-ph img{filter:grayscale(.85) brightness(.55)}
.kd.done h3{color:#8f97a6}
.kd.stamp .kd-stamp{animation:stamp .38s cubic-bezier(.2,1.4,.4,1)}
@keyframes stamp{0%{opacity:0;transform:rotate(-12deg) scale(1.9)}60%{opacity:1;transform:rotate(-12deg) scale(.94)}100%{opacity:.92;transform:rotate(-12deg) scale(1)}}
@media (prefers-reduced-motion:reduce){.kd.stamp .kd-stamp{animation:none}}
@media (max-width:760px){.kds{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}.kd-stamp{width:84px;height:84px;margin:-42px 0 0 -42px;font-size:32px}.kd h3{font-size:16px}}

/* 地域 · 死門市 지도 */
.rg-sec{padding:0 0 120px}
.rg-title{display:flex;align-items:baseline;gap:22px;flex-wrap:wrap;margin-bottom:22px}
.rg-city{font-family:var(--kanji);font-size:clamp(46px,6vw,76px);line-height:1;color:#d0141e;letter-spacing:.08em}
.rg-sub{font-size:16px;color:var(--dim);max-width:30em}
.rg-body{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(280px,1fr);gap:28px;align-items:start}
.rg-mapw{overflow-x:auto;border:1px solid #232836;background:#0d1018;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
.rg-map{display:block;width:100%;min-width:640px;height:auto}
.rg-grid line{stroke:rgba(236,231,218,.035);stroke-width:1}
.rg-mtn{fill:none;stroke:rgba(236,231,218,.22);stroke-width:2.5;stroke-linejoin:round}
.rg-river{fill:none;stroke:#16303a;stroke-width:30;stroke-linecap:round}
.rg-rv{font-family:var(--kanji);font-size:22px;fill:#3f7182;letter-spacing:.3em}
.rg-road path{fill:none;stroke:rgba(236,231,218,.12);stroke-width:2;stroke-dasharray:1 0}
.rg-road path.main{stroke:rgba(236,231,218,.2);stroke-width:5}
.rg-d{cursor:pointer;outline:none}
.rg-d path{fill:color-mix(in srgb,var(--c) 10%,transparent);stroke:color-mix(in srgb,var(--c) 55%,transparent);stroke-width:2;transition:fill .25s ease,stroke .25s ease}
.rg-d .hj{font-family:var(--kanji);font-size:26px;fill:var(--ink);text-anchor:middle;letter-spacing:.12em;pointer-events:none}
.rg-d .ko{font-family:var(--body);font-size:14px;fill:var(--dim);text-anchor:middle;pointer-events:none}
@media (hover:hover) and (pointer:fine){.rg-d:hover path{fill:color-mix(in srgb,var(--c) 22%,transparent);stroke:var(--c)}}
.rg-d:focus-visible path{stroke:#d9b45e;stroke-width:3}
.rg-d.on path{fill:color-mix(in srgb,var(--c) 30%,transparent);stroke:var(--c);stroke-width:3}
.rg-d.on .hj{fill:#fff}
.rg-d.veil path{fill:rgba(140,148,165,.08);stroke:rgba(200,205,215,.25);stroke-dasharray:6 7}
.rg-d.veil .hj{fill:rgba(236,231,218,.55);font-size:22px}
.rg-d.veil .ko{font-size:12px}
.rg-d.veil.on path{stroke:var(--c);fill:color-mix(in srgb,var(--c) 16%,transparent)}
.rg-gate rect{fill:#0d1018;stroke:#d0141e;stroke-width:2.5}
.rg-gate text{font-family:var(--kanji);font-size:15px;fill:#e07d88;letter-spacing:.1em}
.rg-core circle{fill:#d0141e}
.rg-core .p{fill:none;stroke:#ff3b4e;stroke-width:2;transform-box:fill-box;transform-origin:center;animation:rgPulse 2.6s ease-out infinite}
.rg-core text{font-family:var(--kanji);font-size:18px;fill:#ff6b77;text-anchor:middle;letter-spacing:.15em;pointer-events:none}
@keyframes rgPulse{from{transform:scale(1);opacity:.9}to{transform:scale(3.2);opacity:0}}
.rg-fog{opacity:.55;animation:rgDrift 26s ease-in-out infinite alternate}
@keyframes rgDrift{from{transform:translateX(-14px)}to{transform:translateX(14px)}}
.rg-unk{font-family:var(--kanji);font-size:20px;fill:rgba(236,231,218,.28);text-anchor:middle;letter-spacing:.2em}
#rgPan{min-width:0}
.rg-pan{border-top:3px solid var(--c);background:#11141b;padding:0 0 22px}
.rg-hd{display:flex;align-items:center;flex-wrap:wrap;gap:8px 14px;padding:20px 22px 6px}
.rg-hj{font-family:var(--kanji);font-size:34px;line-height:1;color:var(--c);letter-spacing:.08em}
.rg-hd b{font-size:18px;flex:1;min-width:6em}
.rg-risk{display:flex;align-items:center;gap:8px}
.rg-risk small{font-size:12.5px;color:var(--dim)}
.rg-q{font-family:var(--kanji);font-size:16px;color:var(--dim)}
.rg-l{display:grid;grid-template-columns:36px minmax(0,1fr);gap:10px;padding:10px 22px 0;margin:0;font-size:16px;line-height:1.8}
.rg-l i{font-style:normal;font-family:var(--kanji);font-size:17px;color:#e0b84a;padding-top:1px}
.rg-l i.nt{color:#ff4655}
.rg-meta{margin:16px 22px 0;border-top:1px solid #232836}
.rg-meta div{display:grid;grid-template-columns:52px minmax(0,1fr);gap:10px;padding:12px 0 0}
.rg-meta dt{font-size:13.5px;color:var(--dim);padding-top:4px}
.rg-meta dd{display:flex;flex-wrap:wrap;gap:6px;margin:0}
.rg-meta dd span{font-size:14.5px;padding:3px 10px;background:#181c26;border:1px solid #262c3a}
.rg-meta dd span small{color:var(--dim);font-size:12px}
.rg-meta dd .none{color:var(--dim);background:none;border-style:dashed}
.rg-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.rg-list button{font-family:var(--kanji);font-size:17px;color:var(--ink);padding:9px 14px;border:1px solid #2a3040;border-left:3px solid var(--c);background:#11141b;display:flex;align-items:baseline;gap:8px;transition:background .2s ease,transform .16s ease-out}
.rg-list button small{font-family:var(--body);font-size:13px;color:var(--dim)}
.rg-list button[aria-pressed="true"]{background:color-mix(in srgb,var(--c) 20%,#11141b)}

</main>
<div id="pfBox" hidden></div>
<canvas id="glass" aria-hidden="true"></canvas>

<script>
(() => {
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = s => document.querySelector(s);
const W = 1600, H = 1000;

/* ---------- 골목 (그림 + 그 위에 얹는 연출, 그림과 같은 좌표계) ---------- */
const IW = 1536, IH = 1024;
function scene(mode){
  const S = mode==='s', p = mode+'-';
  let o = `<svg viewBox="0 0 ${IW} ${IH}" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg"><defs>
  <filter id="${p}soft" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="14"/></filter>
  <filter id="${p}glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <radialGradient id="${p}vig" cx=".5" cy=".55" r=".75"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".6"/></radialGradient>
  </defs><image href="${S?'bg-spirit.webp':'bg-normal.webp'}" width="${IW}" height="${IH}" preserveAspectRatio="xMidYMid slice"/>`;
  if (!S){
    // 가로등 불빛 (깜빡임용)
    o += `<g id="n-lamp" filter="url(#n-soft)"><circle cx="1053" cy="256" r="28" fill="#cfe8ff" opacity=".5"/><circle cx="906" cy="374" r="20" fill="#cfe8ff" opacity=".45"/><circle cx="752" cy="470" r="16" fill="#cfe8ff" opacity=".4"/></g>`;
    o += `<rect id="n-dim" width="${IW}" height="${IH}" fill="#02040a" opacity="0"/>`;
    // 아주 잠깐 비치는 형체
    o += `<g id="n-ghost" opacity="0" fill="#04060a"><ellipse cx="712" cy="566" rx="6" ry="7.5"/><path d="M704 575 Q712 570 720 575 L726 632 L698 632 Z"/><path d="M705 580 L695 626 M719 580 L730 627" stroke="#04060a" stroke-width="3"/></g>`;
  } else {
    // 개문의 붉은 빛 맥동
    o += `<g id="s-rift" style="transform-box:fill-box;transform-origin:center"><ellipse cx="867" cy="585" rx="58" ry="150" fill="#ff1f3a" opacity=".55" filter="url(#s-soft)"/><ellipse cx="867" cy="585" rx="24" ry="122" fill="#ff5a6a" opacity=".5" filter="url(#s-glow)"/></g>`;
    o += `<rect id="s-riftfloor" x="842" y="700" width="50" height="260" fill="#ff3b4e" opacity=".22" filter="url(#s-soft)"/>`;
  }
  o += `<rect width="${IW}" height="${IH}" fill="url(#${p}vig)"/></svg>`;
  return o;
}
$('#normal').innerHTML = scene('n');
$('#spirit').innerHTML = scene('s');
if (!RM){
  // 낮게 울리듯 은은하게
  $('#s-rift').animate([{opacity:.5,transform:'scale(1)'},{opacity:.72,transform:'scale(1.025)'}],{duration:2600,iterations:Infinity,direction:'alternate',easing:'ease-in-out'});
  $('#s-riftfloor').animate([{opacity:.16},{opacity:.26}],{duration:2600,iterations:Infinity,direction:'alternate',easing:'ease-in-out'});
}

/* ---------- 비 ---------- */
const rc = $('#rain'), rx = rc.getContext('2d');
let drops = [], motes = [], mode = 'n', dpr = 1;
function size(){ dpr = Math.min(devicePixelRatio||1,2); rc.width = innerWidth*dpr; rc.height = innerHeight*dpr;
  drops = Array.from({length:Math.round(innerWidth/7)},()=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight,l:10+Math.random()*18,v:9+Math.random()*7}));
  motes = Array.from({length:40},()=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight,v:.2+Math.random()*.5,s:1+Math.random()*2.5,p:Math.random()*6}));
  sizeCracks(); }
function rain(){
  rx.setTransform(dpr,0,0,dpr,0,0); rx.clearRect(0,0,innerWidth,innerHeight);
  rx.strokeStyle = mode==='n' ? 'rgba(190,205,230,.32)' : 'rgba(150,240,230,.22)'; rx.lineWidth = 1; rx.beginPath();
  for (const d of drops){ rx.moveTo(d.x,d.y); rx.lineTo(d.x-d.l*.18,d.y+d.l); if(!RM){ d.y+=d.v*(mode==='n'?1:.55); d.x-=d.v*.18*(mode==='n'?1:.55); if(d.y>innerHeight){d.y=-20;d.x=Math.random()*innerWidth*1.1;} } }
  rx.stroke();
  if (mode==='s'){ rx.save(); rx.shadowColor = 'rgba(255,40,50,.9)'; rx.shadowBlur = 8; for (const m of motes){ rx.fillStyle = `rgba(255,${60+Math.round(40*Math.sin(m.p))},60,${.55+.35*Math.sin(m.p)})`; rx.fillRect(m.x,m.y,m.s*1.3,m.s*1.3); if(!RM){ m.y-=m.v; m.x+=Math.sin(m.p)*.3; m.p+=.03; if(m.y<-10){m.y=innerHeight+10;m.x=Math.random()*innerWidth;} } } rx.restore(); }
  requestAnimationFrame(rain);
}

/* ---------- 정전 노이즈, 깜빡이는 가로등, 잠깐 비치는 형체 ---------- */
const nz = document.createElement('canvas'); nz.width = nz.height = 160; const nx = nz.getContext('2d'), img = nx.createImageData(160,160);
for (let i=0;i<img.data.length;i+=4){ const v=Math.random()*255; img.data[i]=img.data[i+1]=img.data[i+2]=v; img.data[i+3]=60; } nx.putImageData(img,0,0);
$('#noise').style.backgroundImage = `url(${nz.toDataURL()})`;
let opened = false;
function glitch(){
  if (opened) return;
  const lamp = $('#n-lamp'), ghost = $('#n-ghost'), noise = $('#noise');
  if (!RM){ noise.animate([{opacity:0},{opacity:.5},{opacity:.1},{opacity:.4},{opacity:0}],{duration:260}); $('#stage').classList.remove('shake-s'); void $('#stage').offsetWidth; $('#stage').classList.add('shake-s'); }
  lamp.animate([{opacity:1},{opacity:.1},{opacity:.8},{opacity:0},{opacity:1}],{duration:420});
  $('#n-dim').animate([{opacity:0},{opacity:.35},{opacity:.1},{opacity:.4},{opacity:0}],{duration:420});
  if (Math.random()<.55) ghost.animate([{opacity:0},{opacity:.95},{opacity:.95},{opacity:0}],{duration:160,delay:110});
  setTimeout(glitch, 3200+Math.random()*4200);
}
setTimeout(glitch, 2200);

/* ---------- 시계 ---------- */
const tick = () => { const d = new Date(); $('#clock').textContent = String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); };
tick(); setInterval(tick, 20000);

/* ---------- 부적에 획 긋기 ---------- */
const ofuda = $('#ofuda'), ink = $('#ink'), ix = ink.getContext('2d');
let drawing = false, last = null, len = 0;
function sizeInk(){ const r = ofuda.getBoundingClientRect(); ink.width = ofuda.offsetWidth*dpr; ink.height = ofuda.offsetHeight*dpr; ix.setTransform(dpr,0,0,dpr,0,0); ix.lineCap = 'round'; ix.lineJoin = 'round'; }
function local(e){ const r = ink.getBoundingClientRect(); return [ (e.clientX-r.left)*ofuda.offsetWidth/r.width, (e.clientY-r.top)*ofuda.offsetHeight/r.height ]; }
function stroke(a,b,dt){
  const dist = Math.hypot(b[0]-a[0],b[1]-a[1]), w = Math.max(2.5, 9 - dist/(dt||16)*3);
  ix.strokeStyle = '#a81c14'; ix.shadowColor = 'rgba(120,10,5,.5)'; ix.shadowBlur = 2; ix.lineWidth = w;
  ix.beginPath(); ix.moveTo(...a); ix.lineTo(...b); ix.stroke(); len += dist;
}
ofuda.addEventListener('pointerdown', e => { if (opened) return; drawing = true; ofuda.setPointerCapture(e.pointerId); last = {p:local(e),t:performance.now()}; });
ofuda.addEventListener('pointermove', e => { if (!drawing) return; const p = local(e), t = performance.now(); stroke(last.p,p,t-last.t); last = {p,t}; });
const up = () => { if (!drawing) return; drawing = false; if (len > 24) openGate(); };
ofuda.addEventListener('pointerup', up); ofuda.addEventListener('pointercancel', up);
function autoStroke(){ const w = ofuda.offsetWidth, h = ofuda.offsetHeight; let i = 0; const n = 14;
  const step = () => { const a = [w*.3+i/n*w*.4, h*.3+i/n*h*.4], b = [w*.3+(i+1)/n*w*.4, h*.3+(i+1)/n*h*.4]; stroke(a,b,10); if (++i<n) requestAnimationFrame(step); else openGate(); };
  step(); }
ofuda.addEventListener('keydown', e => { if ((e.key==='Enter'||e.key===' ') && !opened){ e.preventDefault(); autoStroke(); } });
$('#skip').onclick = () => {
  if (opened) return; opened = true; drawing = false;
  document.body.classList.add('opened');
  $('#news').textContent = '개문 확인. 신기청 관할 구역입니다.';
  ['#normal','#ofuda-wrap',...COVER].forEach(s => $(s).style.visibility = 'hidden');
  mode = 's'; $('#title').classList.add('on');
};

/* ---------- 개문: 화면 가득 開門 → 한 번에 깨짐 ---------- */
const bgN = new Image(); bgN.src = 'bg-normal.webp';
const sc = $('#shardcv'), sx = sc.getContext('2d');
function sizeCracks(){ sc.width = innerWidth*dpr; sc.height = innerHeight*dpr; layoutKaimon(); }
function layoutKaimon(){
  const k = $('#kaimon'), w = innerWidth, h = innerHeight, vert = h > w*1.1;
  const fs = vert ? Math.min(w*.8, h*.42) : Math.min(w*.45, h*.8);
  k.style.flexDirection = vert ? 'column' : 'row'; k.style.fontSize = fs+'px';
  return {vert, fs};
}
const DARK = .82;
function seamLines(x, w, h){
  x.save(); x.strokeStyle = 'rgba(255,70,80,.9)'; x.lineWidth = 2; x.shadowColor = 'rgba(255,30,50,1)'; x.shadowBlur = 14;
  x.beginPath(); x.moveTo(w/2,0); x.lineTo(w/2,h); x.moveTo(0,h/2); x.lineTo(w,h/2); x.moveTo(w,0); x.lineTo(0,h); x.stroke(); x.restore();
}
function snapshot(){
  const w = innerWidth, h = innerHeight, c = document.createElement('canvas'), x = c.getContext('2d');
  c.width = w*dpr; c.height = h*dpr; x.scale(dpr,dpr);
  x.fillStyle = '#06070a'; x.fillRect(0,0,w,h);
  seamLines(x, w, h);
  const {vert, fs} = layoutKaimon();
  x.font = `400 ${fs}px 'Yuji Syuku','Noto Serif JP','Noto Serif CJK JP',serif`; x.textAlign = 'center'; x.textBaseline = 'middle';
  x.fillStyle = '#d0141e'; x.shadowColor = 'rgba(255,30,40,.55)'; x.shadowBlur = 50;
  if (vert){ x.fillText('開',w/2,h/2-fs*.5); x.fillText('門',w/2,h/2+fs*.5); } else { x.fillText('開',w/2-fs*.5,h/2); x.fillText('門',w/2+fs*.5,h/2); }
  return c;
}
function buildShards(cx,cy){
  const w = innerWidth, h = innerHeight, R = Math.hypot(w,h), S = 13;
  const radii = [0,.05,.12,.22,.36,.56,1.25].map(r=>r*R);
  const P = radii.map((r,i)=>Array.from({length:S},(_,j)=>{ if(!i) return [cx,cy]; const a = (j+(Math.random()-.5)*.55)/S*Math.PI*2 + i*.12, rr = r*(1+(Math.random()-.5)*.28); return [cx+Math.cos(a)*rr, cy+Math.sin(a)*rr]; }));
  const out = [];
  const add = poly => { const c = poly.reduce((m,p)=>[m[0]+p[0]/poly.length,m[1]+p[1]/poly.length],[0,0]); const dx = c[0]-cx, dy = c[1]-cy, d = Math.hypot(dx,dy)||1;
    out.push({poly,c,ux:dx/d,uy:dy/d,sp:(380+Math.random()*700)*(.5+d/R*1.6),vr:(Math.random()-.5)*5,sg:.15+Math.random()*.35}); };
  for (let i=0;i<radii.length-1;i++) for (let j=0;j<S;j++){
    const A = P[i][j], B = P[i][(j+1)%S], C = P[i+1][(j+1)%S], D = P[i+1][j];
    if (!i) add([A,C,D]); else if (Math.random()<.55){ add([A,B,C]); add([A,C,D]); } else add([A,B,C,D]);
  }
  const segs = [];
  for (const s of out) s.poly.forEach((p,k)=>{ const q = s.poly[(k+1)%s.poly.length], d1 = Math.hypot(p[0]-cx,p[1]-cy), d2 = Math.hypot(q[0]-cx,q[1]-cy);
    segs.push(d1<=d2 ? {a:p,b:q,d1,d2} : {a:q,b:p,d1:d2,d2:d1}); });
  out.segs = segs; out.maxD = Math.hypot(Math.max(cx,w-cx), Math.max(cy,h-cy));
  return out;
}
function drawCracks(snap, shards, p){
  const w = innerWidth, h = innerHeight, reach = p*shards.maxD;
  sx.setTransform(dpr,0,0,dpr,0,0); sx.clearRect(0,0,w,h); sx.drawImage(snap,0,0,w,h);
  sx.save(); sx.strokeStyle = 'rgba(255,220,220,.32)'; sx.lineWidth = .8; sx.shadowColor = 'rgba(255,60,70,.5)'; sx.shadowBlur = 3; sx.beginPath();
  for (const s of shards.segs){
    if (s.d1 >= reach) continue;
    const f = s.d2 <= reach ? 1 : (reach-s.d1)/Math.max(1,s.d2-s.d1);
    sx.moveTo(s.a[0],s.a[1]); sx.lineTo(s.a[0]+(s.b[0]-s.a[0])*f, s.a[1]+(s.b[1]-s.a[1])*f);
  }
  sx.stroke(); sx.restore();
}
function drawShards(snap, shards, t){
  const w = innerWidth, h = innerHeight; sx.setTransform(dpr,0,0,dpr,0,0); sx.clearRect(0,0,w,h);
  const e = 1-Math.pow(1-t,3);
  for (const s of shards){
    const d = s.sp*e*.9;
    sx.save();
    sx.globalAlpha = Math.max(0, 1 - t*t*1.1);
    sx.translate(s.c[0]+s.ux*d, s.c[1]+s.uy*d + 160*t*t);
    sx.rotate(s.vr*e); sx.scale(1+s.sg*e, 1+s.sg*e); sx.translate(-s.c[0], -s.c[1]);
    sx.beginPath(); s.poly.forEach((p,k)=> k ? sx.lineTo(p[0],p[1]) : sx.moveTo(p[0],p[1])); sx.closePath();
    sx.save(); sx.clip(); sx.drawImage(snap,0,0,w,h); sx.restore();
    sx.strokeStyle = 'rgba(255,225,225,.16)'; sx.lineWidth = .8; sx.stroke();
    sx.restore();
  }
}
const tween = (D, fn, ease = t=>t) => new Promise(res => { const t0 = performance.now(); const f = now => { const t = Math.min(1,(now-t0)/D); fn(ease(t)); t<1 ? requestAnimationFrame(f) : res(); }; requestAnimationFrame(f); });
const wait = ms => new Promise(r => setTimeout(r, ms));
const COVER = ['#dark','#doors','#seams','#kaimon'];

async function openGate(){
  if (opened) return; opened = true;
  document.body.classList.add('opened');
  $('#news').textContent = '개문 확인. 신기청 관할 구역입니다.';
  ofuda.classList.add('lit');
  const r = ofuda.getBoundingClientRect(), cx = r.left+r.width/2, cy = r.top+r.height/2;
  const stage = $('#stage'), dk = $('#dark');
  const shake = c => { if (RM) return; stage.classList.remove('shake-s','shake-m','shake-l'); void stage.offsetWidth; stage.classList.add(c); };

  // 1. 쿵, 쿵, 쿵 세 번에 걸쳐 어두워진다
  await wait(260);
  $('#ofuda-wrap').classList.add('burn');
  for (const lv of [.35,.6,.85]){ dk.style.opacity = lv; shake('shake-s'); await wait(380); }

  // 2. 문이 닫힌다: 양옆, 위아래, 대각선
  for (const [cls, seam] of [['lr','v'],['tb','h'],['dg','d']]){
    $('#doors').classList.add(cls);
    await wait(RM?60:190);
    $('#seam-'+seam).style.opacity = 1; shake('shake-m');
    await wait(360);
  }

  // 3. 開. 門.
  layoutKaimon();
  for (const ch of document.querySelectorAll('#kaimon span')){ ch.classList.add('on'); shake('shake-m'); await wait(420); }
  await wait(260);

  if (RM){
    for (const sel of ['#normal',...COVER]) $(sel).animate([{opacity:1},{opacity:0}],{duration:500,fill:'forwards'});
    mode = 's'; await wait(500); $('#title').classList.add('on'); return;
  }

  // 4. 순식간에 금 → 쨍그랑
  const snap = snapshot(), shards = buildShards(cx,cy);
  drawCracks(snap, shards, 0);
  $('#normal').style.visibility = 'hidden'; COVER.forEach(s => $(s).style.visibility = 'hidden');
  await tween(110, p => drawCracks(snap, shards, p));
  await wait(60);
  $('#flash').animate([{opacity:0},{opacity:.9},{opacity:0}],{duration:340,easing:'ease-out'});
  await wait(50);
  shake('shake-l'); mode = 's';
  await tween(950, t => drawShards(snap, shards, t));
  sx.setTransform(1,0,0,1,0,0); sx.clearRect(0,0,sc.width,sc.height);
  $('#title').classList.add('on');
}

/* ---------- 다시 보기 ---------- */
window.replayGate = () => {
  opened = false; mode = 'n'; len = 0;
  document.body.classList.remove('opened');
  $('#news').innerHTML = '일대 원인 불명 정전 신고 <span class="long">3건 접수 중</span>';
  $('#title').classList.remove('on');
  sx.setTransform(1,0,0,1,0,0); sx.clearRect(0,0,sc.width,sc.height);
  for (const sel of ['#normal',...COVER]){ const el = $(sel); el.getAnimations().forEach(a=>a.cancel()); el.style.visibility = ''; }
  $('#dark').style.opacity = 0;
  const ds = document.querySelectorAll('#doors .d'); ds.forEach(d => d.style.transition = 'none');
  $('#doors').className = ''; void $('#doors').offsetWidth; ds.forEach(d => d.style.transition = '');
  document.querySelectorAll('#seams line').forEach(l => l.style.opacity = 0);
  document.querySelectorAll('#kaimon span').forEach(s => s.classList.remove('on'));
  ofuda.classList.remove('lit'); $('#ofuda-wrap').classList.remove('burn'); ix.clearRect(0,0,ink.width,ink.height);
  setTimeout(glitch, 2000);
};



/* ---------- 메뉴 페이지 ---------- */
// 古(고어체) / 今(단문체) 두 벌을 함께 넣고, #page 의 class 로 하나만 보인다
const t = (o, n) => `<span class="o">${o}</span><span class="n">${n ?? o}</span>`;
const POW = [
  // [한자, 이름, 사도 여부, [설명 古, 今], [이름표 한자, 한글], [한 문장 古, 今]]
  ['祝詞','축사',0,['말에 神力을 실어 結界를 치고, 씻어내며, 얽어매느니라.','말에 신력을 실어 결계를 치고, 씻어내고, 묶는다.'],['代價','대가'],['한 번에 過한 神力을 말에 실으면 목소리를 잃느니라.','한 번에 너무 많은 신력을 말에 실으면 목소리를 잃는다.']],
  ['符','부적',0,['미리 써둔 符를 던지거나 붙이나니, 갖추어만 두면 누구든 쓸 수 있느니라.','미리 써둔 부적을 던지거나 붙인다. 준비만 해두면 누구나 쓴다.'],['規則','규칙'],['센 怪異를 相對할 符는 먹이 아닌 쓰는 이의 피로 써야 하느니라.','강한 괴이를 상대할 부적은 먹이 아닌 쓰는 이의 피로 써야 한다.']],
  ['神樂舞','신락무',0,['방울과 부채를 들고 춤으로 넓은 땅을 씻어내느니라.','방울과 부채를 들고, 춤으로 넓은 땅을 씻어낸다.'],['消耗','소모'],['춤 한 번에 많은 神力과 氣力을 한꺼번에 쏟아야 하느니라.','춤 한 번에 많은 신력과 기력을 한꺼번에 쏟아야 한다.']],

function baguaMarkup(){
  const R = 222, r2 = 150, oct = rr => Array.from({length:8},(_,i)=>{ const a = (i*45-22.5)*Math.PI/180; return (Math.sin(a)*rr).toFixed(1)+','+(-Math.cos(a)*rr).toFixed(1); }).join(' ');
  const nodes = POW.map((p,i)=>{ const a = i*45*Math.PI/180, x = Math.sin(a)*186, y = -Math.cos(a)*186;
    return `<g class="bg-node ${p[2]?'dark':''}" data-i="${i}" tabindex="0" role="button" aria-label="${p[1]}" transform="translate(${x.toFixed(1)} ${y.toFixed(1)})"><g class="up"><text class="hj" y="${p[0].length>2?6:10}" font-size="${p[0].length>2?24:32}">${p[0]}</text><text class="ko" y="${p[0].length>2?30:36}">${p[1]}</text></g></g>`; }).join('');
  const spokes = Array.from({length:8},(_,i)=>{ const a = (i*45-22.5)*Math.PI/180; return `<line x1="${(Math.sin(a)*72).toFixed(1)}" y1="${(-Math.cos(a)*72).toFixed(1)}" x2="${(Math.sin(a)*R).toFixed(1)}" y2="${(-Math.cos(a)*R).toFixed(1)}"/>`; }).join('');
  return `<div class="bagua"><div class="bg-dial">
    <svg viewBox="-250 -262 500 512" aria-hidden="false">
      <polygon class="bg-wedge" points="0,0 ${(Math.sin(-22.5*Math.PI/180)*R).toFixed(1)},${(-Math.cos(-22.5*Math.PI/180)*R).toFixed(1)} ${(Math.sin(22.5*Math.PI/180)*R).toFixed(1)},${(-Math.cos(22.5*Math.PI/180)*R).toFixed(1)}"/>
      <path class="bg-mark" d="M-9 -258 L9 -258 L0 -240 Z"/>
      <g class="bg-wheel">
        <polygon class="bg-oct" points="${oct(R)}"/><polygon class="bg-oct in" points="${oct(r2)}"/>
        <g class="bg-spoke">${spokes}</g>
        ${nodes}
      </g>
      <circle class="bg-core" r="66"/><text class="bg-god" y="16">神</text>
    </svg></div>
    <div class="bg-detail" id="bgDetail" aria-live="polite"></div></div>`;
}
function bindBagua(){
  const root = document.querySelector('.bagua'); if (!root) return;
  const svg = root.querySelector('svg'), det = $('#bgDetail');
  let cur = 0, turn = 0;
  const render = i => { const p = POW[i];
    det.className = 'bg-detail' + (p[2] ? ' dark' : '');
    det.innerHTML = `<div class="pd-top"><span class="pd-h">${p[0]}</span><span class="pd-n">${p[1]}<small>${p[2]?t('邪道','사도'):t('正統','정통')}</small></span></div>
      <p class="pd-d">${t(...p[3])}</p>
      <div class="pd-rule"><span class="pd-tag">${t(p[4][0],p[4][1])}</span><p>${t(...p[5])}</p></div>`; };
  const pick = i => {
    let d = ((i-cur)%8+8)%8; if (d>4) d -= 8;
    turn -= d*45; cur = i;
    svg.style.setProperty('--w', turn+'deg');
    root.querySelectorAll('.bg-node').forEach(n => n.classList.toggle('on', +n.dataset.i===i));
    root.classList.toggle('dark', !!POW[i][2]);
    if (RM){ render(i); return; }
    det.animate([{opacity:1,transform:'translateY(0)'},{opacity:0,transform:'translateY(6px)'}],{duration:140,easing:'ease-in'}).finished.then(()=>{ render(i);
      det.animate([{opacity:0,transform:'translateY(-6px)'},{opacity:1,transform:'translateY(0)'}],{duration:300,easing:'cubic-bezier(.23,1,.32,1)'}); });
  };
  root.querySelectorAll('.bg-node').forEach(n => {
    n.addEventListener('click', () => pick(+n.dataset.i));
    n.addEventListener('keydown', e => { if (e.key==='Enter'||e.key===' '){ e.preventDefault(); pick(+n.dataset.i); } });
  });
  svg.style.setProperty('--w','0deg'); root.querySelector('.bg-node').classList.add('on'); render(0);
}

let fxObs = null;
function bindFaction(){
  if (fxObs){ fxObs.disconnect(); fxObs = null; }
  const rail = document.querySelector('.fx-rail'); if (!rail) return;
  const links = [...rail.querySelectorAll('a')];
  rail.addEventListener('click', e => { const a = e.target.closest('a'); if (!a) return; e.preventDefault(); const el = document.getElementById('fx-'+a.dataset.id); page.scrollTo({top: el.offsetTop, behavior: RM ? 'auto' : 'smooth'}); });
  fxObs = new IntersectionObserver(es => {
    es.forEach(e => { if (!e.isIntersecting) return; const id = e.target.dataset.id;
      links.forEach(a => a.classList.toggle('on', a.dataset.id===id)); rail.dataset.on = id; });
  }, { root: page, rootMargin: '-45% 0px -50% 0px' });
  document.querySelectorAll('.fx').forEach(s => fxObs.observe(s));
  const fall = document.querySelector('.fx-nakhwa .fx-deco');
  if (fall && !fall.children.length) for (let i=0;i<12;i++){ const e = document.createElement('i'); e.style.left = (4+Math.random()*92)+'%'; e.style.animationDelay = (-Math.random()*9).toFixed(2)+'s'; e.style.animationDuration = (7+Math.random()*6).toFixed(2)+'s'; e.style.scale = (.6+Math.random()*.8).toFixed(2); fall.appendChild(e); }
  const hero = document.querySelector('#page .pg-hero');
  new IntersectionObserver(es => es.forEach(e => rail.classList.toggle('show', !e.isIntersecting)), { root: page, threshold: 0 }).observe(hero);
}

// 카드는 옆으로 밀어서, 프로필 창은 사진을 눌러서 다음 사진으로 넘긴다. 있는 파일만 자동으로 잡힌다.
const GAL_MAX = 3, galCache = {};
function galProbe(code){
  if (galCache[code]) return galCache[code];
  const tries = Array.from({length:GAL_MAX-1}, (_,i) => `images/characters/${code}_${i+2}.webp`);
  return galCache[code] = Promise.all(tries.map(src => new Promise(r => { const im = new Image(); im.onload = () => r(src); im.onerror = () => r(null); im.src = src; }))).then(a => a.filter(Boolean));
}
function initGal(box){
  if (box.dataset.galReady) return; box.dataset.galReady = '1';
  galProbe(box.dataset.gal).then(extra => {
    if (!extra.length || box.classList.contains('empty')) return;
    const base = box.querySelector('img');
    extra.forEach(src => { const im = document.createElement('img'); im.src = src; im.alt = base.alt; im.draggable = false; box.insertBefore(im, box.querySelector('.gal-dots')); });
    const dots = box.querySelector('.gal-dots'); dots.innerHTML = '<i class="on"></i>' + extra.map(()=>'<i></i>').join('');
    box.classList.add('multi'); box.dataset.i = 0;
  });
}
function galGo(box, step){
  const ims = [...box.querySelectorAll('img')]; if (ims.length < 2) return false;
  const n = ims.length, i = ((+box.dataset.i||0) + step + n) % n; box.dataset.i = i;
  ims.forEach((im,k) => im.classList.toggle('on', k===i));
  box.querySelectorAll('.gal-dots i').forEach((d,k) => d.classList.toggle('on', k===i));
  return true;
}
const galScan = () => document.querySelectorAll('[data-gal]').forEach(initGal);
let galSwiped = false, galStart = null;
document.addEventListener('pointerdown', e => { const b = e.target.closest('.pc-ph.multi'); galStart = b ? {b, x:e.clientX, y:e.clientY} : null; galSwiped = false; }, true);
document.addEventListener('pointerup', e => {

  if (Math.abs(dx) > 34 && Math.abs(dx) > Math.abs(dy)*1.3){ galGo(galStart.b, dx < 0 ? 1 : -1); galSwiped = true; }
  galStart = null;
}, true);

function rgBlob(r){ // 구역 외곽선: 같은 id면 늘 같은 모양으로 일그러진 원
  let h = 0; for (const ch of r.id) h = (h*31 + ch.charCodeAt(0)) >>> 0;
  const rnd = () => (h = (h*1103515245 + 12345) >>> 0, h / 4294967296);
  const n = 11, pts = [];
  const ro = (r.rot||0)*Math.PI/180, cs = Math.cos(ro), sn = Math.sin(ro);
  for (let i=0;i<n;i++){ const a = i/n*Math.PI*2, k = .82 + rnd()*.34, px = Math.cos(a)*r.rx*k, py = Math.sin(a)*r.ry*k; pts.push([r.x + px*cs - py*sn, r.y + px*sn + py*cs]); }
  let d = '';
  for (let i=0;i<n;i++){ const p0 = pts[(i-1+n)%n], p1 = pts[i], p2 = pts[(i+1)%n], p3 = pts[(i+2)%n];
    if (!i) d += `M${p1[0].toFixed(1)},${p1[1].toFixed(1)}`;
    d += `C${(p1[0]+(p2[0]-p0[0])/6).toFixed(1)},${(p1[1]+(p2[1]-p0[1])/6).toFixed(1)} ${(p2[0]-(p3[0]-p1[0])/6).toFixed(1)},${(p2[1]-(p3[1]-p1[1])/6).toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`; }
  return d + 'Z';
}

    if (m && method==='GET' && m[2]==='/comments') return { comments: d.comments.filter(x=>x.post==m[1]) };
    if (m && method==='POST' && m[2]==='/vote'){ const p = d.posts.find(x=>x.id==m[1]); if (!p) throw new Error('없는 글입니다');
      const old = d.votes[p.id]||0, v = body.v; if (old===1) p.likes--; if (old===-1) p.dislikes--; if (v===1) p.likes++; if (v===-1) p.dislikes++;
      if (v) d.votes[p.id] = v; else delete d.votes[p.id]; this.save(d); return { likes:p.likes, dislikes:p.dislikes, my:v }; }
    if (m && method==='POST' && !m[1]){ const imgs = []; for (const f of body.files) imgs.push(await blobToData(await rmShrink(f, 900)));
      const p = {id:d.seq++, body:body.body, name:body.name||'', images:imgs, likes:0, dislikes:0, created:Date.now()}; d.posts.push(p); this.save(d); return { id:p.id }; }
    if (m && method==='POST' && m[2]==='/comments'){ d.comments.push({id:d.seq++, post:+m[1], body:body.body, name:body.name||'', created:Date.now()}); this.save(d); return { ok:true }; }
    if (m && method==='DELETE'){ d.posts = d.posts.filter(x=>x.id!=m[1]); d.comments = d.comments.filter(x=>x.post!=m[1]); this.save(d); return { ok:true }; }
    if (c && method==='DELETE'){ d.comments = d.comments.filter(x=>x.id!=c[1]); this.save(d); return { ok:true }; }
    throw new Error('알 수 없는 요청');
  }
};
async function rmApi(method, path, body){
  if (!RUMOR.mode){ try { const r = await fetch(RM_API+'/ping', {cache:'no-store'}); RUMOR.mode = r.ok && (await r.json()).ok ? 'live' : 'demo'; } catch(e){ RUMOR.mode = 'demo'; } }
  if (RUMOR.mode === 'demo') return demo.call(method, path, body);
  const headers = RUMOR.admin ? {'X-Admin-Key':RUMOR.admin} : {};
  let url = RM_API+path, init = { method, headers };
  if (method==='GET' && body?.page) url += `?page=${body.page}&sort=${body.sort}&seed=${body.seed}`;
  else if (body?.files){ const fd = new FormData(); fd.append('body', body.body); fd.append('name', body.name); for (const f of body.files) fd.append('images', await rmShrink(f), 'photo.jpg'); init.body = fd; }
  else if (method==='POST'){ headers['Content-Type'] = 'application/json'; init.body = JSON.stringify(body); }
  const r = await fetch(url, init), j = await r.json().catch(()=>({}));
  if (!r.ok) throw new Error(j.error || '요청이 실패했습니다');
  return j;
}
